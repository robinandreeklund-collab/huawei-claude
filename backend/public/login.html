<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in to Claude Code</title>
    <style>
      :root {
        --bg: #262624; --surface: #1f1e1d; --surface-2: #30302e; --ink: #f5f4ee;
        --muted: #b1ada1; --faint: #86837c; --clay: #d97757; --clay-deep: #c15f3c;
        --border: #3a3936; --on-clay: #2a1a12; --ok: #7bbd8a; --err: #e0806a;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body {
        font-family: "Styrene A", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        background: var(--bg); color: var(--ink); padding: 1.5rem; -webkit-font-smoothing: antialiased;
      }
      .serif { font-family: Copernicus, "Tiempos Text", Georgia, serif; }
      .card {
        max-width: 26rem; width: 100%; background: var(--surface);
        border: 1px solid var(--border); border-radius: 20px; padding: 2rem; text-align: center;
      }
      .spark { color: var(--clay); margin-bottom: .4rem; }
      h1 { font-size: 1.5rem; font-weight: 500; margin: 0 0 .5rem; }
      p { color: var(--muted); line-height: 1.55; }
      .code {
        font-family: ui-monospace, monospace; font-size: 1.6rem; letter-spacing: .18em; color: var(--ink);
        background: var(--bg); border: 1px solid var(--border);
        border-radius: 12px; padding: .75rem 1rem; margin: 1rem 0; display: inline-block;
      }
      input {
        font-family: ui-monospace, monospace; font-size: 1.2rem; text-align: center;
        width: 100%; padding: .8rem; letter-spacing: .12em; outline: none;
        background: var(--bg); color: var(--ink); border: 1px solid var(--border); border-radius: 13px;
      }
      input:focus { border-color: var(--clay); box-shadow: 0 0 0 3px rgba(217,119,87,.16); }
      button {
        margin-top: 1.25rem; width: 100%; padding: .9rem; font-size: 1rem; font-weight: 600;
        background: var(--clay); color: var(--on-clay); border: none; border-radius: 999px; cursor: pointer;
      }
      button:active { background: var(--clay-deep); }
      button:disabled { opacity: .5; cursor: default; }
      .ok { color: var(--ok); }
      .err { color: var(--err); }
      small { color: var(--faint); }
    </style>
  </head>
  <body>
    <div class="card">
      <svg class="spark" width="30" height="30" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2.5 13.7 9.3 20.5 11 13.7 12.7 12 19.5 10.3 12.7 3.5 11 10.3 9.3z" fill="currentColor"/></svg>
      <h1 class="serif">Sign in on your watch</h1>
      <p>Confirm that this watch may control your Claude Code session.</p>
      <div id="codeBox"></div>
      <input id="code" placeholder="XXXX-XXXX" autocomplete="off" autocapitalize="characters" />
      <button id="approve">Approve watch</button>
      <p id="status"></p>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      const input = document.getElementById("code");
      const codeBox = document.getElementById("codeBox");
      const status = document.getElementById("status");
      const btn = document.getElementById("approve");

      const preset = params.get("code");
      if (preset) {
        input.value = preset;
        codeBox.innerHTML = '<div class="code">' + preset + "</div>";
      }

      btn.addEventListener("click", async () => {
        const user_code = input.value.trim().toUpperCase();
        if (!user_code) return;
        btn.disabled = true;
        status.textContent = "Approving…";
        try {
          const r = await fetch("/login", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ user_code }),
          });
          const data = await r.json();
          if (data.approved) {
            status.innerHTML = '<span class="ok">✓ Watch approved. You can put your phone away.</span>';
          } else {
            status.innerHTML = '<span class="err">Code not found or expired.</span>';
            btn.disabled = false;
          }
        } catch (e) {
          status.innerHTML = '<span class="err">Something went wrong: ' + e + "</span>";
          btn.disabled = false;
        }
      });
    </script>
  </body>
</html>
