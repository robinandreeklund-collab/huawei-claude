<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claude Code — watch relay test</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        font-family: system-ui, -apple-system, sans-serif; margin: 0;
        background: #0f1115; color: #e8eaed; display: flex; flex-direction: column;
        min-height: 100vh;
      }
      header { padding: 1rem 1.25rem; border-bottom: 1px solid #262b36; display: flex;
        align-items: center; gap: .75rem; }
      header h1 { font-size: 1rem; margin: 0; font-weight: 600; }
      .dot { width: .6rem; height: .6rem; border-radius: 50%; background: #6b7280; }
      .dot.on { background: #7bd88f; }
      main { flex: 1; display: grid; grid-template-columns: 320px 1fr; gap: 0; min-height: 0; }
      @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
      .panel { padding: 1.25rem; overflow: auto; }
      .left { border-right: 1px solid #262b36; }
      .qr { background: #fff; padding: .5rem; border-radius: 12px; display: inline-block; }
      .qr img { display: block; width: 240px; height: 240px; }
      .usercode { font-family: ui-monospace, monospace; font-size: 1.4rem; letter-spacing: .12em;
        margin: .75rem 0; }
      button { padding: .7rem 1rem; font-size: .95rem; font-weight: 600; border: none;
        border-radius: 9px; background: #d97757; color: #1a1205; cursor: pointer; }
      button.ghost { background: #232833; color: #e8eaed; }
      #log { font-family: ui-monospace, monospace; font-size: .85rem; line-height: 1.5;
        white-space: pre-wrap; word-break: break-word; }
      .msg { padding: .5rem .75rem; border-radius: 9px; margin-bottom: .5rem; }
      .assistant { background: #1a2230; }
      .tool { background: #201a16; color: #d9a77c; }
      .meta { color: #6b7280; }
      .err { background: #2a1618; color: #ff9d95; }
      .composer { display: flex; gap: .5rem; padding: 1rem 1.25rem; border-top: 1px solid #262b36; }
      .composer input { flex: 1; padding: .7rem; border-radius: 9px; border: 1px solid #262b36;
        background: #0f1115; color: #e8eaed; font-size: .95rem; }
      small { color: #6b7280; }
      .step { margin-bottom: 1rem; }
    </style>
  </head>
  <body>
    <header>
      <span class="dot" id="dot"></span>
      <h1>Claude Code — watch relay test</h1>
      <span class="meta" id="state">ej ansluten</span>
    </header>
    <main>
      <div class="panel left">
        <div class="step">
          <button id="startBtn">1. Starta inloggning (visa QR)</button>
        </div>
        <div id="qrArea"></div>
        <div class="step" id="connectArea" style="display:none">
          <button id="connectBtn" class="ghost">3. Anslut klockan (använd token)</button>
        </div>
        <small
          >Skanna QR:en med mobilen, tryck "Godkänn", så plockar den här sidan upp token
          automatiskt — precis som klockan skulle göra.</small
        >
      </div>
      <div class="panel">
        <div id="log"></div>
      </div>
    </main>
    <div class="composer">
      <input id="prompt" placeholder="Skriv en instruktion till Claude Code…" disabled />
      <button id="sendBtn" disabled>Skicka</button>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const log = $("log");
      let deviceCode = null;
      let token = null;
      let ws = null;
      let pollTimer = null;

      function line(text, cls) {
        const div = document.createElement("div");
        div.className = "msg " + (cls || "meta");
        div.textContent = text;
        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
      }

      $("startBtn").addEventListener("click", async () => {
        const r = await fetch("/device/code", { method: "POST" });
        const dc = await r.json();
        deviceCode = dc.device_code;
        $("qrArea").innerHTML =
          '<div class="qr"><img src="' + dc.qr_data_url + '" alt="QR"></div>' +
          '<div class="usercode">' + dc.user_code + "</div>" +
          '<small>Öppnar: ' + dc.verification_uri_complete + "</small>";
        $("connectArea").style.display = "none";
        line("Väntar på godkännande från mobilen…");
        startPolling(dc.interval);
      });

      function startPolling(intervalS) {
        clearInterval(pollTimer);
        pollTimer = setInterval(async () => {
          const r = await fetch("/device/token", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ device_code: deviceCode }),
          });
          const data = await r.json();
          if (data.status === "approved") {
            clearInterval(pollTimer);
            token = data.access_token;
            line("✓ Token mottagen. Klockan är inloggad.");
            $("connectArea").style.display = "block";
            connect();
          } else if (data.status === "expired_token") {
            clearInterval(pollTimer);
            line("Koden gick ut — starta om.", "err");
          }
        }, (intervalS || 3) * 1000);
      }

      $("connectBtn").addEventListener("click", connect);

      function connect() {
        if (ws) ws.close();
        const proto = location.protocol === "https:" ? "wss" : "ws";
        ws = new WebSocket(proto + "://" + location.host + "/ws");
        ws.onopen = () => {
          $("state").textContent = "ansluten";
          $("dot").classList.add("on");
          ws.send(JSON.stringify({ type: "auth", token }));
        };
        ws.onclose = () => {
          $("state").textContent = "frånkopplad";
          $("dot").classList.remove("on");
          $("prompt").disabled = true;
          $("sendBtn").disabled = true;
        };
        ws.onmessage = (ev) => {
          const m = JSON.parse(ev.data);
          switch (m.type) {
            case "authed":
              line("Autentiserad — redo att ta emot instruktioner.");
              $("prompt").disabled = false;
              $("sendBtn").disabled = false;
              break;
            case "assistant":
              line(m.text, "assistant");
              break;
            case "tool_use":
              line("⚙ " + m.name + " " + JSON.stringify(m.input), "tool");
              break;
            case "needs_confirmation":
              line("⚠ Kräver bekräftelse: " + m.command, "err");
              break;
            case "result":
              line("— klar (" + JSON.stringify(m.cost) + ")");
              break;
            case "error":
              line("Fel: " + m.message, "err");
              break;
          }
        };
      }

      function send() {
        const text = $("prompt").value.trim();
        if (!text || !ws) return;
        line("› " + text);
        ws.send(JSON.stringify({ type: "prompt", text }));
        $("prompt").value = "";
      }
      $("sendBtn").addEventListener("click", send);
      $("prompt").addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
    </script>
  </body>
</html>
