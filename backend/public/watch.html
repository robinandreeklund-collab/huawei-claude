<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claude — Watch Ultimate 2</title>
    <style>
      :root {
        --bg: #262624; --surface: #1f1e1d; --surface-2: #34322f;
        --ink: #f7f6f1; --muted: #b1ada1; --faint: #86837c;
        --clay: #d97757; --clay-deep: #c15f3c; --clay-tint: rgba(217,119,87,.18);
        --border: #3a3936; --on-clay: #2a1a12;
        --ok: #7bbd8a; --err: #e0806a; /* warm status accents (Claude palette) */
        color-scheme: dark;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body {
        margin: 0; min-height: 100vh; background: #141311; color: var(--ink);
        font-family: "Styrene A", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex; flex-direction: column; align-items: center; gap: 1rem; padding: 2rem 1rem;
      }
      .serif { font-family: Copernicus, "Tiempos Text", Georgia, serif; }
      .caption { color: var(--faint); font-size: .78rem; text-align: center; max-width: 24rem; line-height: 1.5; }
      .caption b { color: var(--muted); font-weight: 600; }
      /* Fit the fixed-size watch onto narrow phone browsers by scaling the whole unit. */
      @media (max-width: 430px) {
        body { padding: 1rem 0; }
        .watch { transform: scale(calc((100vw - 18px) / 396)); transform-origin: top center; margin-bottom: -46px; }
      }

      .watch { position: relative; }
      .bezel {
        width: 372px; height: 372px; border-radius: 50%;
        background: radial-gradient(circle at 50% 26%, #3d3d39, #131210 74%);
        padding: 12px; box-shadow: 0 26px 74px rgba(0,0,0,.7), inset 0 0 0 2px #4c4a45;
      }
      .crown { position: absolute; right: -9px; width: 12px; border-radius: 5px;
        background: linear-gradient(#5c584f, #2b2926); cursor: pointer; transition: box-shadow .15s; }
      .crown.upper { top: 120px; height: 54px; } .crown.upper.pulse { box-shadow: 0 0 0 5px var(--clay-tint); }
      .crown.lower { top: 206px; height: 34px; }

      .screen { width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: var(--bg);
        position: relative; touch-action: none; }
      /* Content fills the whole round face; the circle naturally crops the corners. */
      .topbar { position: absolute; top: 0; left: 0; right: 0; height: 58px; z-index: 3;
        display: flex; align-items: center; justify-content: center; gap: .45rem; padding: 20px 70px 0;
        font-size: .66rem; color: var(--muted); letter-spacing: .04em;
        background: linear-gradient(var(--bg) 55%, transparent); pointer-events: none; }
      .navttl { pointer-events: auto; display: inline-flex; align-items: center; gap: .3rem; cursor: pointer;
        color: var(--ink); font-size: .82rem; min-width: 0; max-width: 8.5rem; }
      .navttl .cname, .navttl b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .navttl svg { color: var(--muted); }
      .dot { width: .4rem; height: .4rem; border-radius: 50%; background: var(--faint); }
      .dot.on { background: #7bbd8a; }
      .iconbtn { background: none; border: none; color: var(--muted); cursor: pointer; padding: 4px; display: grid; place-items: center; }
      .iconbtn:active { color: var(--ink); }

      .view { position: absolute; inset: 0; }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
      .view > * { animation: fade .16s ease; }

      .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
        justify-content: center; text-align: center; gap: .7rem; padding: 0 44px; }
      h2 { font-size: 1.15rem; margin: 0; font-weight: 500; }
      p.small { font-size: .8rem; color: var(--muted); margin: 0; line-height: 1.45; }
      .burst line { stroke: var(--clay); stroke-width: 2.1; stroke-linecap: round; }
      .qr img { width: 140px; height: 140px; border-radius: 14px; background: #fff; padding: 5px; }
      .usercode { font-family: ui-monospace, monospace; letter-spacing: .18em; font-size: 1.05rem; }
      button.pill { border: none; border-radius: 999px; padding: .7rem 1.5rem; font-size: .9rem; font-weight: 600;
        background: var(--clay); color: var(--on-clay); cursor: pointer; }
      button.pill:active { background: var(--clay-deep); }

      /* --- Wheel list (fills the face; centered item is the focus) --- */
      .wheel { position: absolute; inset: 0; overflow-y: auto; scrollbar-width: none;
        display: flex; flex-direction: column; gap: 11px; padding: 128px 26px 150px; scroll-snap-type: y proximity; }
      .wheel::-webkit-scrollbar { display: none; }
      .wheel.deck { justify-content: center; padding: 70px 26px; gap: 13px; }
      .card { scroll-snap-align: center; background: var(--surface); border-radius: 22px; cursor: pointer;
        display: flex; align-items: center; gap: 15px; padding: 17px 19px; min-height: 70px;
        transition: transform .14s ease, background .14s, box-shadow .14s; }
      .card .ic { color: var(--clay); flex: 0 0 auto; display: grid; place-items: center; }
      .card .tx { flex: 1; min-width: 0; }
      .card .t { font-size: 1.02rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.2; }
      .card .s { font-size: .74rem; color: var(--faint); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .card .chev { color: var(--faint); flex: 0 0 auto; }
      .card.focus { background: var(--surface-2); box-shadow: inset 0 0 0 2px var(--clay); }
      .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--faint); font-size: .82rem; }

      /* --- Chat (messaging-app style) --- */
      .cname { color: var(--clay); font-weight: 600; border-bottom: 2px solid var(--clay); padding-bottom: 2px; }
      .feed { position: absolute; inset: 0; overflow-y: auto; scrollbar-width: none;
        display: flex; flex-direction: column; gap: .55rem; padding: 64px 18px 138px; }
      .feed::-webkit-scrollbar { display: none; }
      .mrow { display: flex; flex-direction: column; max-width: 100%; }
      .mrow.out { align-items: flex-end; } .mrow.in { align-items: flex-start; }
      .bubble { max-width: 86%; padding: .58rem .8rem; border-radius: 21px; font-size: .87rem; line-height: 1.42;
        word-break: break-word; position: relative; }
      .bubble.out { background: var(--clay); color: var(--on-clay); border-bottom-right-radius: 7px; font-weight: 500; }
      .bubble.in { background: var(--surface); color: var(--ink); border-bottom-left-radius: 7px; }
      .bubble.filtered { background: #3a201c; color: #f0b3a6; }
      .time { font-size: .6rem; color: var(--faint); margin: .2rem .4rem 0; }
      .tool { align-self: flex-start; font-family: ui-monospace, monospace; font-size: .72rem; color: var(--clay);
        background: var(--surface); padding: .4rem .6rem; border-radius: 12px; display: inline-flex; align-items: center; gap: .4rem; }
      .flag { position: absolute; top: 5px; right: 8px; color: currentColor; opacity: .45; cursor: pointer; display: inline-grid; }

      /* Bottom bar: suggested quick replies + dock. Extra bottom padding keeps the
         round mic/keyboard buttons off the clipped bottom curve. */
      .bottombar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; display: flex; flex-direction: column;
        align-items: center; gap: .5rem; padding-bottom: 40px; background: linear-gradient(transparent, var(--bg) 42%); }
      .status { font-size: .68rem; color: var(--muted); min-height: .85rem; }
      .quick { display: flex; gap: .4rem; overflow-x: auto; max-width: 84%; padding: 0 8px; scrollbar-width: none; justify-content: center; }
      .quick::-webkit-scrollbar { display: none; }
      .chip { flex: 0 0 auto; background: var(--surface-2); border: 1px solid var(--border); color: var(--ink);
        border-radius: 999px; padding: .42rem .85rem; font-size: .78rem; cursor: pointer; white-space: nowrap; }
      .chip:active { background: var(--clay-tint); }
      /* Compose bar: two clay circles — mic (left), keyboard (right) */
      .dock { display: flex; align-items: center; justify-content: center; gap: 2.4rem; }
      .cbtn { width: 60px; height: 60px; border-radius: 50%; border: none; cursor: pointer; color: var(--on-clay);
        background: radial-gradient(circle at 50% 30%, #e88b68, var(--clay-deep)); display: grid; place-items: center;
        box-shadow: 0 6px 18px rgba(193,95,60,.4); transition: transform .08s, box-shadow .15s; touch-action: none; }
      .cbtn:active { transform: scale(.96); }
      .cbtn.rec { transform: scale(1.1); box-shadow: 0 0 0 10px var(--clay-tint); }
      /* Compose input sits in the round-safe zone (raised off the curved edge),
         with the mic/keyboard dock hidden while typing so nothing overlaps. */
      .typing { position: absolute; left: 0; right: 0; margin-inline: auto; width: min(264px, 84%); bottom: 52px;
        z-index: 6; display: none; align-items: center; gap: .5rem; animation: fadeUp .18s var(--ease); }
      .typing input { flex: 1; min-width: 0; background: var(--surface-2); border: 1px solid var(--border); color: var(--ink);
        border-radius: 999px; padding: .72rem 1rem; font-size: .9rem; outline: none; transition: border-color .15s; }
      .typing input::placeholder { color: var(--faint); }
      .typing input:focus { border-color: var(--clay); }
      .typing button { border: none; background: var(--clay); color: var(--on-clay); border-radius: 50%;
        width: 42px; height: 42px; flex: 0 0 auto; display: grid; place-items: center; cursor: pointer; }
      .typing button:active { background: var(--clay-deep); }

      pre.code { position: absolute; inset: 0; margin: 0; overflow: auto; padding: 62px 22px 40px;
        font-family: ui-monospace, monospace; font-size: .72rem; line-height: 1.5; color: #d8d4ca; white-space: pre; }

      .toolbar { display: flex; gap: .8rem; }
      .toolbar button { background: var(--surface); border: 1px solid var(--border); color: var(--muted);
        border-radius: 999px; padding: .42rem .95rem; font-size: .8rem; cursor: pointer; }

      /* --- Controls: menu sheet, confirm card, stop, usage, toast --- */
      /* Inline in the centered top row so it stays inside the round face (not a
         clipped corner). pointer-events auto since .topbar disables them. */
      .topmenu { background: none; border: none; color: var(--muted); cursor: pointer; padding: 4px;
        pointer-events: auto; display: inline-grid; place-items: center; flex: 0 0 auto; }
      .topmenu:active { color: var(--ink); }
      .plan-on .cname { color: #d9a35f; border-bottom-color: #d9a35f; }

      .sheet { position: absolute; inset: 0; z-index: 8; background: rgba(15,14,13,.72);
        backdrop-filter: blur(3px); display: flex; flex-direction: column; align-items: center;
        justify-content: safe center; gap: .5rem; padding: 70px 30px; overflow-y: auto; scrollbar-width: none; }
      .sheet::-webkit-scrollbar { display: none; }
      .sheet > * { animation: fade .16s ease; flex: 0 0 auto; }
      .sheet .srow { width: 100%; display: flex; align-items: center; gap: .7rem; background: var(--surface-2);
        border: 1px solid var(--border); border-radius: 16px; padding: .7rem .9rem; cursor: pointer;
        color: var(--ink); font-size: .9rem; transition: transform .1s, background .12s; }
      .sheet .srow:active { transform: scale(.97); background: var(--clay-tint); }
      .sheet .srow .ic { color: var(--clay); display: grid; place-items: center; }
      .sheet .srow .sub { color: var(--faint); font-size: .74rem; }
      .sheet .srow.tog[data-on="1"] { box-shadow: inset 0 0 0 2px var(--clay); }

      .cfm { align-self: stretch; background: #2a2320; border: 1px solid #5a4a33; border-radius: 18px;
        padding: .7rem .8rem; margin: .2rem 0; }
      .cfm .h { font-size: .78rem; color: #e0b072; font-weight: 600; margin-bottom: .3rem; display: flex; align-items: center; gap: .35rem; }
      .cfm code { display: block; font-family: ui-monospace, monospace; font-size: .74rem; color: #f0e5d5;
        background: #191512; border-radius: 8px; padding: .4rem .5rem; margin-bottom: .5rem; white-space: pre-wrap; word-break: break-word; }
      .cfm .row { display: flex; gap: .5rem; }
      .cfm button { flex: 1; border: none; border-radius: 999px; padding: .5rem; font-weight: 600; font-size: .82rem;
        cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: .3rem; }
      .cfm .allow { background: var(--clay); color: var(--on-clay); }
      .cfm .deny { background: var(--surface-2); color: var(--ink); border: 1px solid var(--border); }

      .stopbtn { display: none; align-items: center; gap: .4rem; background: var(--surface-2);
        border: 1px solid var(--border); color: var(--ink); border-radius: 999px; padding: .4rem .9rem;
        font-size: .8rem; cursor: pointer; }
      .stopbtn.show { display: inline-flex; animation: fadeUp .2s var(--ease); }
      .stopbtn .ic { color: var(--clay); display: grid; place-items: center; }

      .usagebox { align-self: stretch; }
      .usagebar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin-top: .5rem; }
      .usagebar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--clay), var(--clay-deep)); }

      .toast { position: absolute; left: 0; right: 0; margin-inline: auto; width: min(250px, 82%); bottom: 100px;
        z-index: 9; text-align: center;
        background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: .6rem .8rem;
        font-size: .82rem; color: var(--ink); animation: fadeUp .22s var(--ease); }

      /* --- Watch actions: notification, timer, sensor, context menu --- */
      .notif { position: absolute; top: 40px; left: 0; right: 0; margin-inline: auto; width: min(250px, 82%);
        z-index: 12; display: flex; gap: .6rem;
        align-items: center; background: linear-gradient(135deg, #34322f, #262624);
        border: 1px solid var(--border); border-radius: 20px; padding: .7rem .85rem;
        box-shadow: 0 14px 34px rgba(0,0,0,.55); animation: notifIn .42s var(--spring) both; }
      .notif.out { animation: notifOut .32s var(--ease) forwards; }
      .notif .spark { color: var(--clay); flex: 0 0 auto; }
      .notif .tx { min-width: 0; }
      .notif .t { font-size: .86rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .notif .b { font-size: .74rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      @keyframes notifIn { from { opacity: 0; transform: translateY(-130%) scale(.9); } to { opacity: 1; transform: none; } }
      @keyframes notifOut { to { opacity: 0; transform: translateY(-130%) scale(.9); } }

      .timerwrap { position: absolute; inset: 0; z-index: 11; display: grid; place-items: center;
        background: radial-gradient(circle at 50% 45%, rgba(38,38,36,.86), rgba(20,19,17,.94));
        backdrop-filter: blur(2px); animation: fade .2s ease; }
      .timerwrap.done .tnum { color: var(--clay); animation: tPulse .5s var(--ease) 3; }
      .timerring { position: relative; width: 200px; height: 200px; }
      .timerring svg { transform: rotate(-90deg); }
      .timerring .trk { fill: none; stroke: var(--surface-2); stroke-width: 5; }
      .timerring .arc { fill: none; stroke: var(--clay); stroke-width: 5; stroke-linecap: round;
        stroke-dasharray: 596; stroke-dashoffset: 0; }
      .tmid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .1rem; }
      .tnum { font-size: 2.4rem; font-weight: 600; font-variant-numeric: tabular-nums; }
      .tlabel { font-size: .78rem; color: var(--muted); max-width: 8rem; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tdismiss { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%);
        background: var(--surface-2); border: 1px solid var(--border); color: var(--ink);
        border-radius: 999px; padding: .4rem 1.1rem; font-size: .8rem; cursor: pointer; z-index: 2; }
      @keyframes tPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }

      .sensor { align-self: flex-start; display: inline-flex; align-items: center; gap: .45rem;
        background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
        padding: .4rem .7rem; font-size: .78rem; color: var(--ink); animation: fadeUp .24s var(--spring); }
      .sensor .hb { color: #e0806a; animation: heart 1s ease-in-out infinite; }
      @keyframes heart { 0%,100% { transform: scale(1); } 30% { transform: scale(1.28); } }

      .ctxmenu { position: absolute; z-index: 14; background: var(--surface-2); border: 1px solid var(--border);
        border-radius: 16px; padding: .3rem; box-shadow: 0 16px 40px rgba(0,0,0,.6); min-width: 9.5rem;
        animation: ctxIn .18s var(--spring) both; transform-origin: top center; }
      @keyframes ctxIn { from { opacity: 0; transform: scale(.86); } to { opacity: 1; transform: none; } }
      .ctxmenu .ci { display: flex; align-items: center; gap: .55rem; padding: .55rem .7rem; border-radius: 11px;
        font-size: .86rem; color: var(--ink); cursor: pointer; }
      .ctxmenu .ci:active { background: var(--clay-tint); }
      .ctxmenu .ci.danger { color: var(--err); } .ctxmenu .ci.danger .ic { color: var(--err); }
      .ctxmenu .ci .ic { color: var(--clay); display: grid; place-items: center; }

      /* --- Settings screen --- */
      .setwheel { padding: 70px 22px 120px; gap: 11px; }
      .acct { display: flex; align-items: center; gap: 13px; background: linear-gradient(135deg, var(--surface-2), var(--surface));
        border: 1px solid var(--border); border-radius: 20px; padding: 15px 17px; }
      .acct .ic { width: 40px; height: 40px; border-radius: 50%; background: var(--clay-tint); color: var(--clay);
        display: grid; place-items: center; flex: 0 0 auto; }
      .acct .tx { min-width: 0; } .acct .t { font-size: .96rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .acct .s { font-size: .74rem; color: var(--faint); margin-top: 1px; }
      .acct .s.plan { color: var(--clay); font-weight: 600; }
      .setrow { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--border);
        border-radius: 18px; padding: 13px 16px; cursor: pointer; transition: background .14s, transform .1s; }
      .setrow:active { transform: scale(.98); background: var(--surface-2); }
      .setrow .ic { color: var(--clay); display: grid; place-items: center; flex: 0 0 auto; }
      .setrow .tx { flex: 1; min-width: 0; } .setrow .t { font-size: .92rem; } .setrow .s { font-size: .72rem; color: var(--faint); margin-top: 1px; }
      .switch { width: 42px; height: 25px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border);
        flex: 0 0 auto; position: relative; transition: background .2s; }
      .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 19px; height: 19px; border-radius: 50%;
        background: var(--muted); transition: transform .22s var(--spring), background .2s; }
      .switch.on { background: var(--clay); } .switch.on::after { transform: translateX(17px); background: var(--on-clay); }
      .seglabel { font-size: .72rem; color: var(--muted); margin: .5rem 0 -.2rem 4px; }
      .seg { display: flex; gap: 5px; background: var(--surface); border: 1px solid var(--border); border-radius: 15px; padding: 4px; }
      .seg button { flex: 1; border: none; background: none; color: var(--muted); border-radius: 11px; padding: .5rem 0;
        font-size: .8rem; cursor: pointer; transition: background .16s, color .16s; }
      .seg button.on { background: var(--clay); color: var(--on-clay); font-weight: 600; }

      .ripple { position: absolute; z-index: 20; width: 12px; height: 12px; border-radius: 50%;
        background: var(--clay); pointer-events: none; transform: translate(-50%, -50%);
        animation: rip .5s var(--ease) forwards; }
      @keyframes rip { from { opacity: .5; transform: translate(-50%,-50%) scale(1); }
        to { opacity: 0; transform: translate(-50%,-50%) scale(9); } }

      /* --- Motion & polish --- */
      :root { --ease: cubic-bezier(.22,.61,.36,1); --spring: cubic-bezier(.34,1.56,.64,1); }
      @keyframes slideFwd { from { opacity: 0; transform: translateX(26px); } to { opacity: 1; transform: none; } }
      @keyframes slideBack { from { opacity: 0; transform: translateX(-26px); } to { opacity: 1; transform: none; } }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: none; } }
      @keyframes bubbleIn { from { opacity: 0; transform: translateY(9px) scale(.98); } to { opacity: 1; transform: none; } }
      @keyframes spinSlow { to { transform: rotate(360deg); } }
      @keyframes dotb { 0%,60%,100% { opacity: .3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
      .card { transition: box-shadow .16s var(--ease), background .16s var(--ease); }
      .mrow { animation: bubbleIn .26s var(--ease); }
      .chip { transition: transform .1s, background .12s; } .chip:active { transform: scale(.93); }
      .pill { transition: transform .1s, background .12s; } .pill:active { transform: scale(.96); }
      .navttl { transition: opacity .15s; } .navttl:active { opacity: .6; }
      .center .burst { animation: spinSlow 16s linear infinite; }
      .thumb { position: absolute; right: 6px; width: 3.5px; border-radius: 3px; background: var(--muted);
        opacity: 0; transition: opacity .35s var(--ease); z-index: 4; pointer-events: none; }
      .tdots { display: inline-flex; gap: 4px; padding: .15rem .1rem; }
      .tdots span { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: dotb 1.1s infinite; }
      .tdots span:nth-child(2) { animation-delay: .15s; } .tdots span:nth-child(3) { animation-delay: .3s; }
      @media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

      /* --- Splash / loading (Claude design) --- */
      .splash { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 1rem;
        background: radial-gradient(circle at 50% 41%, #302d29 0%, var(--bg) 68%); }
      .splash .ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
      .splash .ring .track { fill: none; stroke: var(--surface); stroke-width: 1.3; }
      .splash .ring .arc { fill: none; stroke: var(--clay); stroke-width: 1.3; stroke-linecap: round;
        stroke-dasharray: 289; stroke-dashoffset: 289; animation: ringSweep 1.5s var(--ease) forwards; }
      @keyframes ringSweep { to { stroke-dashoffset: 0; } }
      .sparkWrap { position: relative; width: 100px; height: 100px; display: grid; place-items: center;
        animation: sparkIn .62s var(--ease) both; }
      @keyframes sparkIn { from { opacity: 0; transform: scale(.55); } to { opacity: 1; transform: none; } }
      .sparkWrap .glow { position: absolute; width: 128px; height: 128px; border-radius: 50%;
        background: radial-gradient(circle, var(--clay-tint) 0%, transparent 64%);
        animation: glowPulse 2.6s ease-in-out infinite; }
      @keyframes glowPulse { 0%,100% { opacity: .45; transform: scale(.9); } 50% { opacity: 1; transform: scale(1.1); } }
      .spark2 { position: relative; z-index: 2; animation: spinSlow 22s linear infinite; }
      .spark2 line { stroke: var(--clay); stroke-width: 2.1; stroke-linecap: round;
        stroke-dasharray: 12; stroke-dashoffset: 12;
        animation: rayDraw .55s var(--ease) forwards, rayShimmer 2.8s ease-in-out infinite; }
      @keyframes rayDraw { to { stroke-dashoffset: 0; } }
      @keyframes rayShimmer { 0%,100% { opacity: .8; } 50% { opacity: 1; } }
      .splash .word { font-size: 1.55rem; color: var(--ink); letter-spacing: .01em; opacity: 0;
        animation: fadeUp .5s var(--ease) .5s forwards; }
      .splash .load { display: inline-flex; gap: 5px; opacity: 0; animation: fadeUp .4s var(--ease) .95s forwards; }
      .splash .load span { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); animation: dotb 1.2s infinite; }
      .splash .load span:nth-child(2) { animation-delay: .16s; } .splash .load span:nth-child(3) { animation-delay: .32s; }
      /* Reduced motion: snap to the finished frame so the spark is always visible. */
      @media (prefers-reduced-motion: reduce) {
        .spark2 line { stroke-dashoffset: 0; } .splash .ring .arc { stroke-dashoffset: 0; }
        .splash .word, .splash .load { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div class="watch">
      <div class="bezel">
        <div class="screen" id="screen">
          <div class="topbar" id="topbar"></div>
          <div class="view" id="view"></div>
          <div class="thumb" id="thumb"></div>
        </div>
      </div>
      <div class="crown upper" id="crown" title="Digital Crown — rotate to navigate, press to select"></div>
      <div class="crown lower" id="crownBack" title="Lower button — back"></div>
    </div>

    <div class="toolbar">
      <button id="ttsBtn">Read aloud: on</button>
      <button id="resetBtn">Restart</button>
    </div>
    <p class="caption">
      Watch Ultimate 2 · Claude design. Navigate with <b>touch</b> or the <b>crown</b>
      (rotate = move, press = select; lower button = back). In the browser:
      <b>scroll wheel</b> rotates, clicking the crown presses.
    </p>

    <script>
      const I = {
        chat: 'M4 5.5h16a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H9l-4 3.5V6.5a1 1 0 0 1 1-1z',
        folder: 'M3 6.5A1.5 1.5 0 0 1 4.5 5h4l2 2h7A1.5 1.5 0 0 1 19 8.5v8A1.5 1.5 0 0 1 17.5 18h-13A1.5 1.5 0 0 1 3 16.5z',
      };
      function icon(name, size = 26) {
        const s = `width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"`;
        switch (name) {
          case "chat": return `<svg ${s}><path d="${I.chat}"/></svg>`;
          case "folder": return `<svg ${s}><path d="${I.folder}"/></svg>`;
          case "code": return `<svg ${s}><polyline points="8.5 8 4.5 12 8.5 16"/><polyline points="15.5 8 19.5 12 15.5 16"/></svg>`;
          case "back": return `<svg ${s}><polyline points="14.5 5 8 12 14.5 19"/></svg>`;
          case "chev": return `<svg ${s}><polyline points="9.5 6 15 12 9.5 18"/></svg>`;
          case "plus": return `<svg ${s}><line x1="12" y1="6" x2="12" y2="18"/><line x1="6" y1="12" x2="18" y2="12"/></svg>`;
          case "mic": return `<svg ${s}><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><line x1="12" y1="17.5" x2="12" y2="21"/></svg>`;
          case "kbd": return `<svg ${s}><rect x="3" y="7" width="18" height="10" rx="2"/><line x1="7" y1="11" x2="7" y2="11"/><line x1="11" y1="11" x2="11" y2="11"/><line x1="15" y1="11" x2="15" y2="11"/><line x1="8" y1="14" x2="16" y2="14"/></svg>`;
          case "term": return `<svg ${s}><polyline points="6 8 10 12 6 16"/><line x1="12" y1="16" x2="18" y2="16"/></svg>`;
          case "flag": return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V5a1 1 0 0 1 1-1h11l-2 4 2 4H6"/></svg>`;
          case "menu": return `<svg ${s}><circle cx="12" cy="5.5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="18.5" r="1.4"/></svg>`;
          case "stop": return `<svg ${s}><rect x="7" y="7" width="10" height="10" rx="2.5"/></svg>`;
          case "check": return `<svg ${s}><polyline points="5 12.5 10 17.5 19 6.5"/></svg>`;
          case "x": return `<svg ${s}><line x1="6.5" y1="6.5" x2="17.5" y2="17.5"/><line x1="17.5" y1="6.5" x2="6.5" y2="17.5"/></svg>`;
          case "gauge": return `<svg ${s}><path d="M4.5 15a7.5 7.5 0 0 1 15 0"/><line x1="12" y1="15" x2="15" y2="10.5"/></svg>`;
          case "undo": return `<svg ${s}><polyline points="8 6 4 10 8 14"/><path d="M4 10h9a5 5 0 0 1 0 10h-3"/></svg>`;
          case "plan": return `<svg ${s}><path d="M9 4h6a1 1 0 0 1 1 1v0a1 1 0 0 1-1 1H9A1 1 0 0 1 8 5v0a1 1 0 0 1 1-1z"/><path d="M8 5H6a1 1 0 0 0-1 1v13a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1h-2"/><polyline points="9 12 11 14 15 10"/></svg>`;
          case "bell": return `<svg ${s}><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6z"/><path d="M10.5 19a1.5 1.5 0 0 0 3 0"/></svg>`;
          case "clock": return `<svg ${s}><circle cx="12" cy="12" r="8"/><polyline points="12 8 12 12 15 14"/></svg>`;
          case "heart": return `<svg ${s}><path d="M12 20s-7-4.6-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.4-7 10-7 10z"/></svg>`;
          case "pin": return `<svg ${s}><path d="M12 21s6-5.4 6-10a6 6 0 0 0-12 0c0 4.6 6 10 6 10z"/><circle cx="12" cy="11" r="2.2"/></svg>`;
          case "cpu": return `<svg ${s}><rect x="7" y="7" width="10" height="10" rx="2"/><path d="M10 3v2M14 3v2M10 19v2M14 19v2M3 10h2M3 14h2M19 10h2M19 14h2"/></svg>`;
          case "edit": return `<svg ${s}><path d="M4 20h4L18.5 9.5a2 2 0 0 0-2.8-2.8L5 17.2z"/><line x1="14" y1="8" x2="17" y2="11"/></svg>`;
          case "trash": return `<svg ${s}><polyline points="4 7 20 7"/><path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"/><path d="M9.5 7V5a1.5 1.5 0 0 1 1.5-1.5h2A1.5 1.5 0 0 1 14.5 5v2"/></svg>`;
          case "branch": return `<svg ${s}><circle cx="7" cy="6" r="2.2"/><circle cx="7" cy="18" r="2.2"/><circle cx="17" cy="9" r="2.2"/><path d="M7 8v8M7 12h5a3 3 0 0 0 3-3"/></svg>`;
          case "gear": return `<svg ${s}><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M4.2 7l2.2 1.3M17.6 15.7 19.8 17M4.2 17l2.2-1.3M17.6 8.3 19.8 7"/></svg>`;
          case "user": return `<svg ${s}><circle cx="12" cy="8" r="3.4"/><path d="M5.5 20a6.5 6.5 0 0 1 13 0"/></svg>`;
          case "globe": return `<svg ${s}><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.4 2.5 14.6 0 17M12 3.5c-2.5 2.4-2.5 14.6 0 17"/></svg>`;
          case "sound": return `<svg ${s}><path d="M5 9v6h3l4 3.5V5.5L8 9z"/><path d="M15.5 9.5a3.5 3.5 0 0 1 0 5"/></svg>`;
        }
        return "";
      }
      function burst(size = 44) {
        const cx = 12, cy = 12, r0 = 3.4, r1 = 8.8, n = 12; let l = "";
        for (let i = 0; i < n; i++) { const a = (i * 2 * Math.PI) / n;
          l += `<line x1="${(cx + r0 * Math.cos(a)).toFixed(2)}" y1="${(cy + r0 * Math.sin(a)).toFixed(2)}" x2="${(cx + r1 * Math.cos(a)).toFixed(2)}" y2="${(cy + r1 * Math.sin(a)).toFixed(2)}"/>`; }
        return `<svg class="burst" width="${size}" height="${size}" viewBox="0 0 24 24">${l}</svg>`;
      }
      // Claude spark whose rays draw outward from the centre, staggered around the circle.
      function sparkRays(size = 76) {
        const cx = 12, cy = 12, r0 = 2.9, r1 = 9.4, n = 12; let l = "";
        for (let i = 0; i < n; i++) { const a = (i * 2 * Math.PI) / n - Math.PI / 2;
          l += `<line x1="${(cx + r0 * Math.cos(a)).toFixed(2)}" y1="${(cy + r0 * Math.sin(a)).toFixed(2)}" x2="${(cx + r1 * Math.cos(a)).toFixed(2)}" y2="${(cy + r1 * Math.sin(a)).toFixed(2)}" style="animation-delay:${(i * 0.045).toFixed(3)}s,${(i * 0.045).toFixed(3)}s"/>`; }
        return `<svg class="spark2" width="${size}" height="${size}" viewBox="0 0 24 24">${l}</svg>`;
      }

      const view = document.getElementById("view");
      const topbar = document.getElementById("topbar");
      let meta = { demoMode: false, stt: false };
      let deviceCode = null, token = null, ws = null, pollTimer = null;
      let claudeConnected = false, connectTimer = null, booted = false;
      let ttsOn = true, recorder = null, chunks = [], recMime = "audio/webm";
      let pendingAI = "", ctx = "Claude", curKind = "chat", planOn = false, notifOn = true, lang = "";
      const nav = { mode: "select", focusables: [], idx: 0, scrollEl: null };

      setInterval(() => { const d = new Date(); const el = document.getElementById("clock");
        if (el) el.textContent = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }, 1000);

      document.getElementById("ttsBtn").addEventListener("click", (e) => {
        ttsOn = !ttsOn; e.target.textContent = "Read aloud: " + (ttsOn ? "on" : "off"); if (!ttsOn) speechSynthesis.cancel(); });
      document.getElementById("resetBtn").addEventListener("click", () => location.reload());

      const TTS_LANG = { svenska: "sv-SE", english: "en-US" };
      function speak(text) { if (!ttsOn || !text) return;
        const short = text.split(/(?<=[.!?])\s/)[0].slice(0, 160);
        const u = new SpeechSynthesisUtterance(short); u.lang = TTS_LANG[lang] || "en-US"; speechSynthesis.cancel(); speechSynthesis.speak(u); }

      // --- Top bar ---
      function setTop(mode, title) {
        const dot = `<span class="dot ${ws && ws.readyState === 1 ? "on" : ""}"></span>`;
        const clock = `${dot}<span id="clock">--:--</span>${meta.demoMode ? " · DEMO" : ""}`;
        if (mode === "home") topbar.innerHTML = clock + `<button class="topmenu" id="homeGear">${icon("gear", 20)}</button>`;
        else if (mode === "nav") topbar.innerHTML = `${dot}<span class="navttl">${icon("back", 17)}${esc(title)}</span>`;
        else if (mode === "chat") topbar.innerHTML = `${dot}<span class="navttl">${icon("back", 17)}<b class="cname">${esc(title)}</b></span><button class="topmenu" id="chatMenu">${icon("menu", 20)}</button>`;
        else topbar.innerHTML = "";
        const b = topbar.querySelector(".navttl"); if (b) b.onclick = () => back();
        const mn = document.getElementById("chatMenu"); if (mn) mn.onclick = () => showMenu();
        const g = document.getElementById("homeGear"); if (g) g.onclick = () => { dir = "fwd"; showSettings(); };
      }

      // --- Motion engine: depth-wheel, momentum scroll, transitions, thumb ---
      const screenEl = document.getElementById("screen");
      let scroller = null, dir = "fade", thumbTimer = null, targetScroll = null, scrollRaf = 0, throttled = false;

      function bindScroller() {
        scroller = view.querySelector(".wheel, .feed");
        if (scroller) { scroller.addEventListener("scroll", onScroll, { passive: true });
          requestAnimationFrame(() => { applyDepth(); updateThumb(); }); }
        else { document.getElementById("thumb").style.opacity = 0; }
      }
      function onScroll() { if (throttled) return; throttled = true;
        requestAnimationFrame(() => { applyDepth(); updateThumb(); throttled = false; }); }

      // Curved-crown depth: the item nearest the screen centre is largest & brightest.
      function applyDepth() {
        if (!scroller || !scroller.classList.contains("wheel") || scroller.classList.contains("deck")) return;
        const sr = screenEl.getBoundingClientRect(), cy = sr.top + sr.height / 2, R = sr.height / 2;
        // Read phase: gather all measurements first, then write — no read/write thrash.
        const cards = scroller.querySelectorAll(".card");
        const d = [];
        cards.forEach((c) => { const r = c.getBoundingClientRect(); d.push(Math.min(1, Math.abs(r.top + r.height / 2 - cy) / R)); });
        cards.forEach((c, i) => {
          c.style.transform = `scale(${(1 - d[i] * 0.15).toFixed(3)})`;
          c.style.opacity = (1 - d[i] * 0.32).toFixed(3); // keep off-centre rows readable
        });
      }
      function updateThumb() {
        const t = document.getElementById("thumb"); if (!t) return;
        if (!scroller) { t.style.opacity = 0; return; }
        const ch = scroller.clientHeight, sh = scroller.scrollHeight;
        if (sh <= ch + 4) { t.style.opacity = 0; return; }
        const H = screenEl.clientHeight, trackTop = H * 0.22, trackH = H * 0.56;
        const th = Math.max(20, trackH * ch / sh);
        t.style.height = th + "px";
        t.style.top = (trackTop + (scroller.scrollTop / (sh - ch)) * (trackH - th)) + "px";
        t.style.opacity = 0.85;
        clearTimeout(thumbTimer); thumbTimer = setTimeout(() => (t.style.opacity = 0), 1000);
      }
      function smoothScrollBy(delta) {
        if (!scroller) return;
        const max = scroller.scrollHeight - scroller.clientHeight;
        targetScroll = Math.max(0, Math.min(max, (targetScroll == null ? scroller.scrollTop : targetScroll) + delta));
        if (scrollRaf) return;
        const step = () => { const cur = scroller.scrollTop, diff = targetScroll - cur;
          if (Math.abs(diff) < 0.5) { scroller.scrollTop = targetScroll; targetScroll = null; scrollRaf = 0; return; }
          scroller.scrollTop = cur + diff * 0.2; scrollRaf = requestAnimationFrame(step); };
        scrollRaf = requestAnimationFrame(step);
      }
      function enter() {
        view.style.animation = "none"; void view.offsetWidth;
        if (dir !== "none")
          view.style.animation = dir === "back" ? "slideBack .28s var(--ease)" : dir === "fade" ? "fadeUp .22s var(--ease)" : "slideFwd .28s var(--ease)";
        dir = "fwd";
      }
      function afterRender() {
        // Cancel any in-flight momentum scroll so it can't drive the new screen's scroller.
        if (scrollRaf) { cancelAnimationFrame(scrollRaf); scrollRaf = 0; }
        targetScroll = null;
        enter(); bindScroller();
      }

      // --- Crown / touch nav ---
      function registerFocus() { nav.focusables = [...view.querySelectorAll("[data-focus]")]; nav.idx = 0; applyFocus(true); }
      function applyFocus(instant) {
        nav.focusables.forEach((el, i) => el.classList.toggle("focus", i === nav.idx));
        nav.focusables[nav.idx]?.scrollIntoView({ block: "center", behavior: instant ? "auto" : "smooth" });
        requestAnimationFrame(applyDepth);
      }
      function rotate(delta) {
        if (nav.mode === "scroll") { smoothScrollBy(delta > 0 ? 72 : -72); return; }
        if (!nav.focusables.length) return;
        nav.idx = (nav.idx + (delta > 0 ? 1 : -1) + nav.focusables.length) % nav.focusables.length; applyFocus();
      }
      function press() { if (nav.mode === "select") nav.focusables[nav.idx]?.click(); }
      document.getElementById("screen").addEventListener("wheel", (e) => { e.preventDefault(); rotate(e.deltaY); }, { passive: false });
      // Silky tactile ripple on any interactive tap.
      screenEl.addEventListener("pointerdown", (e) => {
        if (e.target.closest(".card, .cbtn, .chip, .pill, .srow, .ci, .cbtn, .stopbtn, .topmenu, .navttl")) {
          const b = screenEl.getBoundingClientRect(); rippleAt(e.clientX - b.left, e.clientY - b.top);
        }
      });
      const crown = document.getElementById("crown");
      crown.addEventListener("click", () => { crown.classList.add("pulse"); setTimeout(() => crown.classList.remove("pulse"), 160); press(); });
      document.getElementById("crownBack").addEventListener("click", () => back());
      window.addEventListener("keydown", (e) => { if (e.target.tagName === "INPUT") return;
        if (e.key === "ArrowDown") rotate(1); else if (e.key === "ArrowUp") rotate(-1);
        else if (e.key === "Enter") press(); else if (e.key === "Escape" || e.key === "Backspace") back(); });
      let backStack = [];
      function back() { dir = "back"; const prev = backStack.pop(); if (prev) prev(); }

      // --- Screens ---
      function showSplash() {
        nav.mode = "scroll"; backStack = []; dir = "none"; setTop("hidden");
        view.innerHTML = `<div class="splash">
          <svg class="ring" viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="46"/><circle class="arc" cx="50" cy="50" r="46"/></svg>
          <div class="sparkWrap"><span class="glow"></span>${sparkRays(78)}</div>
          <div class="word serif">Claude</div>
          <div class="load"><span></span><span></span><span></span></div>
        </div>`;
        bindScroller();
      }
      function showPairing() {
        nav.mode = "scroll"; backStack = []; setTop("hidden");
        view.innerHTML = `<div class="center">${burst(48)}<h2 class="serif">Pair</h2>
          <div class="qr" id="qr"></div><div class="usercode" id="uc"></div>
          <p class="small">Scan with your phone and approve.</p></div>`;
        afterRender();
      }
      function showConsent() {
        nav.mode = "select"; dir = "fade"; setTop("hidden");
        view.innerHTML = `<div class="center">${burst(42)}<h2 class="serif">Before we start</h2>
          <p class="small">What you say is sent to the backend and Anthropic to run Claude Code.</p>
          <button class="pill" data-focus id="consentBtn">Agree &amp; continue</button></div>`;
        document.getElementById("consentBtn").onclick = () => wsend({ type: "consent" });
        registerFocus(); afterRender();
      }

      // Second login step: the device QR paired the watch; this connects Claude.
      // Shown when the backend has no Claude credential yet. Scan → opens /connect.
      async function showConnectClaude() {
        nav.mode = "scroll"; dir = "fade"; setTop("hidden"); backStack = [];
        view.innerHTML = `<div class="center" style="padding:0 34px">${burst(40)}
          <h2 class="serif">Connect Claude</h2>
          <div class="qr" id="ccqr"></div>
          <p class="small">Scan to open <b id="ccurl">/connect</b> on your phone and paste your Claude token once.</p></div>`;
        afterRender();
        try {
          const d = await (await fetch("/connect/qr")).json();
          const img = document.getElementById("ccqr"); if (img) img.innerHTML = '<img src="' + d.qr_data_url + '">';
          const u = document.getElementById("ccurl"); if (u) u.textContent = (d.url || "/connect").replace(/^https?:\/\//, "");
        } catch { /* offline */ }
        startConnectPoll();
      }
      function startConnectPoll() {
        clearInterval(connectTimer);
        connectTimer = setInterval(async () => {
          try {
            const s = await (await fetch("/connect/status")).json();
            if (s.connected) { clearInterval(connectTimer); claudeConnected = true; buzz([18, 40, 24]); dir = "fade"; showHome(); }
          } catch { /* keep polling */ }
        }, 3000);
      }
      function stopConnectPoll() { clearInterval(connectTimer); connectTimer = null; }
      // Decide where to land after auth/consent based on Claude connection state.
      function afterConsent() { stopConnectPoll(); if (!claudeConnected) showConnectClaude(); else { dir = "fade"; showHome(); } }

      function card(go, ico, title, sub, big) {
        return `<div class="card" data-focus ${go.k}="${go.v}">
          <span class="ic">${icon(ico, big ? 27 : 24)}</span>
          <span class="tx"><div class="t">${esc(title)}</div>${sub ? `<div class="s">${esc(sub)}</div>` : ""}</span>
          <span class="chev">${icon("chev", 19)}</span></div>`;
      }
      function showHome() {
        nav.mode = "select"; backStack = []; setTop("home");
        view.innerHTML = `<div class="wheel deck">
          ${card({ k: "data-go", v: "chats" }, "chat", "Chats", "your conversations", true)}
          ${card({ k: "data-go", v: "projects" }, "folder", "Projects", "your projects", true)}
          ${card({ k: "data-go", v: "code" }, "code", "Claude Code", "code sessions", true)}
        </div>`;
        view.querySelectorAll("[data-go]").forEach((el) => el.addEventListener("click", () => openMode(el.dataset.go)));
        registerFocus(); afterRender();
      }
      function openMode(scope) { dir = "fwd"; backStack.push(showHome); showList(scope, "…"); wsend({ type: "list", scope }); }

      // --- Settings & account screen ---
      const sw = (on) => `<span class="switch ${on ? "on" : ""}"></span>`;
      function showSettings() {
        nav.mode = "scroll"; setTop("nav", "Settings"); backStack = [showHome];
        view.innerHTML = `<div class="wheel setwheel">
          <div class="acct"><span class="ic">${icon("user", 22)}</span><div class="tx"><div class="t" id="acctName">Checking account…</div><div class="s plan" id="acctPlan">verifying credential</div></div></div>
          <div class="seglabel">Claude replies in</div>
          <div class="seg" id="segLang"><button data-l="">Auto</button><button data-l="english">EN</button><button data-l="svenska">SV</button></div>
          <div class="setrow" data-a="model"><span class="ic">${icon("cpu", 20)}</span><div class="tx"><div class="t">Model</div><div class="s">which model runs</div></div><span class="chev">${icon("chev", 18)}</span></div>
          <div class="setrow" data-a="plan"><span class="ic">${icon("plan", 20)}</span><div class="tx"><div class="t">Plan mode</div><div class="s">review before acting</div></div>${sw(planOn)}</div>
          <div class="setrow" data-a="notif"><span class="ic">${icon("bell", 20)}</span><div class="tx"><div class="t">Notifications</div><div class="s">buzz when Claude alerts</div></div>${sw(notifOn)}</div>
          <div class="setrow" data-a="tts"><span class="ic">${icon("sound", 20)}</span><div class="tx"><div class="t">Read aloud</div><div class="s">speak replies</div></div>${sw(ttsOn)}</div>
        </div>`;
        const seg = document.getElementById("segLang");
        const paint = () => seg.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x.dataset.l === lang));
        paint();

      // --- Live word-by-word streaming of Claude's answer ---
      // A token stream builds the bubble as it arrives; the final (moderated)
      // `assistant` event reconciles it (adds the report flag, or swaps to the

      let curStream = null; const streamQueue = [];
      // Scroll-to-bottom throttled to one frame (avoids a forced reflow per token).
      let scrollPending = false;
      function scrollFeedSoon() {
        if (scrollPending) return; scrollPending = true;
        requestAnimationFrame(() => { scrollPending = false; const feed = document.getElementById("feed"); if (feed) feed.scrollTop = feed.scrollHeight; });
      }
      function startStream() {
        if (curStream) endStream(); // a new text block began before the last one closed
        hideTyping(); const feed = document.getElementById("feed"); if (!feed) return;
        const row = document.createElement("div"); row.className = "mrow in";
        const b = document.createElement("div"); b.className = "bubble in";
        const tn = document.createTextNode(""); b.appendChild(tn); // O(1)-appendable text node
        const t = document.createElement("div"); t.className = "time"; t.textContent = nowTime();
        row.appendChild(b); row.appendChild(t); feed.appendChild(row);

      }
      function appendStream(text) {

        scrollFeedSoon();
      }
      function filterStream() { if (!curStream) startStream(); curStream.filtered = true; curStream.bubble.classList.add("filtered"); curStream.bubble.textContent = "…"; }
      function endStream() { if (curStream) { streamQueue.push(curStream); curStream = null; } }
      function reconcileAssistant(m) {
        const s = streamQueue.shift() || curStream; if (s === curStream) curStream = null;
        if (!s) { bubble("ai", m.text, { report: !m.filtered, filtered: m.filtered }); pendingAI += (m.text || "") + " "; return; }
        const b = s.bubble;
        if (m.filtered) { b.classList.add("filtered"); b.textContent = m.text; }
        else {
          b.classList.remove("filtered"); b.textContent = m.text || b.textContent;
          const flag = document.createElement("span"); flag.className = "flag"; flag.innerHTML = icon("flag");
          flag.onclick = (ev) => { wsend({ type: "report", text: m.text, reason: "user_report" }); ev.currentTarget.textContent = "✓"; };
          b.appendChild(flag);
          pendingAI += (m.text || "") + " ";
        }
        const feed = document.getElementById("feed"); if (feed) feed.scrollTop = feed.scrollHeight;
      }

      // Haptic feedback. On the real watch this is the ArkTS Vibrator Kit (see
      // docs/ondevice-notifications.md); in the browser demo we use the
      // Vibration API as a stand-in (no-op on desktop).
      function buzz(pattern) { try { navigator.vibrate && navigator.vibrate(pattern || 24); } catch {} }

      // --- Suggested quick replies driven by the model (promptSuggestions) ---

      function closeMenu() { const s = document.getElementById("sheet"); if (s) s.remove(); nav.mode = "scroll"; }
      function showMenu() {
        const s = document.createElement("div"); s.className = "sheet"; s.id = "sheet";
        const undoRow = curKind === "chat" ? "" :
          `<div class="srow" data-act="rewind"><span class="ic">${icon("undo", 20)}</span><div>Undo last change<div class="sub">rewind files</div></div></div>`;

      function showUsage(u) {

      // --- Claude ACTS on the watch: vibrate / notify / timer / sensors ---
      function watchAction(m) {

        else if (m.action === "notify") { showNotif(m.title, m.body); buzz([18, 40, 24]); }
        else if (m.action === "timer") { startTimer(m.seconds, m.label); }

      function watchQuery(m) {

        else { const hr = 62 + Math.floor(Math.random() * 26), steps = 3500 + Math.floor(Math.random() * 4200); data = { heartRate: hr, steps }; sensorPill("heart", `${hr} bpm · ${steps.toLocaleString()} steps`); }
        if (ws && ws.readyState === 1) wsend({ type: "watch_reply", id: m.id, data }); buzz(12);
      }
      function sensorPill(ic, text) {
        const feed = document.getElementById("feed"); if (!feed) return;
        const w = document.createElement("div"); w.className = "mrow in";
        const glyph = ic === "heart" ? `<span class="hb">${icon("heart", 15)}</span>` : `<span style="color:var(--clay);display:grid;place-items:center">${icon(ic, 15)}</span>`;
        w.innerHTML = `<span class="sensor">${glyph} Claude read ${esc(text)}</span>`;
        feed.appendChild(w); feed.scrollTop = feed.scrollHeight;
      }
      function showNotif(title, body) {
        const old = document.getElementById("notif"); if (old) old.remove();
        const n = document.createElement("div"); n.className = "notif"; n.id = "notif";
        n.innerHTML = `<span class="spark">${burst(24)}</span><div class="tx"><div class="t">${esc(title || "Claude")}</div>${body ? `<div class="b">${esc(body)}</div>` : ""}</div>`;
        screenEl.appendChild(n);
        const kill = () => { n.classList.add("out"); setTimeout(() => n.remove(), 320); };
        n.onclick = kill; clearTimeout(n._t); n._t = setTimeout(kill, 4200);
      }
      let timerRaf = 0, timerEnd = 0;
      function startTimer(seconds, label) {
        stopTimer();
        const total = Math.max(1, seconds | 0);
        const wrap = document.createElement("div"); wrap.className = "timerwrap"; wrap.id = "timerwrap";
        wrap.innerHTML = `<div class="timerring"><svg width="200" height="200" viewBox="0 0 200 200"><circle class="trk" cx="100" cy="100" r="95"/><circle class="arc" id="tarc" cx="100" cy="100" r="95"/></svg><div class="tmid"><div class="tnum" id="tnum">${fmtTime(total)}</div><div class="tlabel">${esc(label || "Timer")}</div></div></div><button class="tdismiss" id="tdismiss">Dismiss</button>`;
        screenEl.appendChild(wrap);
        document.getElementById("tdismiss").onclick = stopTimer;
        const arc = document.getElementById("tarc"), C = 2 * Math.PI * 95; arc.style.strokeDasharray = C.toFixed(1);
        timerEnd = performance.now() + total * 1000;
        const tick = () => {
          const remMs = timerEnd - performance.now(), rem = Math.max(0, remMs / 1000);
          const n = document.getElementById("tnum"); if (n) n.textContent = fmtTime(Math.ceil(rem));

      function fmtTime(s) { const m = Math.floor(s / 60), ss = s % 60; return m ? `${m}:${String(ss).padStart(2, "0")}` : String(ss); }
      function timerDone(label) { const w = document.getElementById("timerwrap"); if (w) { w.classList.add("done"); const n = document.getElementById("tnum"); if (n) n.textContent = "0"; } buzz([320, 120, 320]); showNotif("Timer done", label || ""); setTimeout(stopTimer, 2600); }
      function stopTimer() { if (timerRaf) cancelAnimationFrame(timerRaf); timerRaf = 0; const w = document.getElementById("timerwrap"); if (w) w.remove(); }

      function rippleAt(x, y) { const r = document.createElement("div"); r.className = "ripple"; r.style.left = x + "px"; r.style.top = y + "px"; screenEl.appendChild(r); setTimeout(() => r.remove(), 520); }
      function rippleCenter() { const b = screenEl.getBoundingClientRect(); rippleAt(b.width / 2, b.height / 2); }

      // --- Long-press context menu on a chat (rename / delete / branch) ---
      function bindLongPress(el, cb) {
        let t = null, fired = false;
        const down = () => { fired = false; t = setTimeout(() => { t = null; fired = true; cb(); }, 480); };
        const cancel = () => { if (t) { clearTimeout(t); t = null; } };

      }
      function openCtx(id, title) {

      function closeCtx() { const m = document.getElementById("ctxmenu"); if (m) m.remove(); }
      function closeCtxOnce(e) { if (!e.target.closest(".ctxmenu")) closeCtx(); }
      function renamePrompt(id, current) {

      function wireChat() {
        const typing = document.getElementById("typing");
        const dock = view.querySelector(".dock");
        const setTyping = (show) => {
          typing.style.display = show ? "flex" : "none";
          if (dock) dock.style.visibility = show ? "hidden" : "visible";
          if (show) document.getElementById("text").focus();
        };
        const openKbd = () => setTyping(typing.style.display !== "flex");

        const sendText = () => { const t = document.getElementById("text").value.trim(); if (!t) return;
          sendPrompt(t); document.getElementById("text").value = ""; setTyping(false); };
        document.getElementById("sendBtn").onclick = sendText;
        document.getElementById("text").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.stopPropagation(); sendText(); } });

        const mic = document.getElementById("mic");
        if (!meta.stt) { mic.onclick = () => setStatus("Voice not configured — use the keyboard"); return; }
        let micStream = null, micCancelled = false;
        const stopTracks = () => { if (micStream) { micStream.getTracks().forEach((t) => t.stop()); micStream = null; } };
        const start = async (e) => {
          e.preventDefault(); micCancelled = false;
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            if (micCancelled) { stream.getTracks().forEach((t) => t.stop()); return; } // released before ready
            micStream = stream;
            recMime = MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm" : "";
            recorder = new MediaRecorder(stream, recMime ? { mimeType: recMime } : undefined);
            chunks = []; recorder.ondataavailable = (ev) => ev.data.size && chunks.push(ev.data);
            recorder.onstop = () => { stopTracks(); sendAudio(); };
            recorder.start(); mic.classList.add("rec"); setStatus("Listening… release");
          } catch { setStatus("Mic denied"); stopTracks(); }
        };
        const stop = (e) => {
          e && e.preventDefault(); micCancelled = true; mic.classList.remove("rec");
          if (recorder && recorder.state !== "inactive") recorder.stop(); else stopTracks();
        };
        mic.addEventListener("pointerdown", start); mic.addEventListener("pointerup", stop); mic.addEventListener("pointerleave", stop);
      }
      async function sendAudio() {
        const mime = recMime || "audio/webm";
        const blob = new Blob(chunks, { type: mime });
        // Native base64 via a data: URL — avoids the O(n²) char-by-char loop.
        const dataUrl = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(blob); });
        const b64 = String(dataUrl).split(",", 2)[1] || "";
        setStatus("Transcribing…");
        wsend({ type: "audio_start", mime });
        wsend({ type: "audio_chunk", data: b64 });
        wsend({ type: "audio_end" });
      }
      const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

      // --- Flow ---
      async function boot() {
        showSplash();
        // Let the splash animation breathe even on a fast network.
        const minSplash = new Promise((r) => setTimeout(r, 1700));
        const metaP = fetch("/meta").then((r) => r.json()).catch(() => ({ demoMode: false, stt: false }));
        const dcP = fetch("/device/code", { method: "POST" }).then((r) => r.json());
        meta = await metaP;
        const dc = await dcP;
        await minSplash;
        buzz([18, 40, 24]); // gentle double-tap as the splash releases
        dir = "fade"; showPairing();
        applyDeviceCode(dc);
        startPolling(dc.interval);
      }
      function applyDeviceCode(dc) {
        deviceCode = dc.device_code;
        const qr = document.getElementById("qr"); if (qr) qr.innerHTML = '<img src="' + dc.qr_data_url + '">';
        const uc = document.getElementById("uc"); if (uc) uc.textContent = dc.user_code;
      }
      // Fetch a fresh device code and restart pairing (e.g. after the old one expires).
      async function renewPairing() {
        try {
          const dc = await (await fetch("/device/code", { method: "POST" })).json();
          applyDeviceCode(dc); startPolling(dc.interval);
        } catch { /* offline; user can Restart */ }
      }
      function startPolling(intervalS) {
        clearInterval(pollTimer);
        pollTimer = setInterval(async () => {
          try {
            const r = await fetch("/device/token", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ device_code: deviceCode }) });
            const data = await r.json();
            if (data.status === "approved") { clearInterval(pollTimer); token = data.access_token; connect(); }
            else if (data.status === "expired_token") { clearInterval(pollTimer); showPairing(); renewPairing(); }
          } catch { /* transient network error; keep polling */ }
        }, (intervalS || 3) * 1000);
      }
      // Guarded send — never throws on a closed/absent socket.
      function wsend(obj) { try { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); } catch {} }
      let reconnectTimer = null, wasOpen = false;
      function connect() {
        const proto = location.protocol === "https:" ? "wss" : "ws";
        ws = new WebSocket(proto + "://" + location.host + "/ws");
        ws.onopen = () => { wasOpen = true; setConn(true); wsend({ type: "auth", token }); };
        ws.onmessage = (ev) => { let m; try { m = JSON.parse(ev.data); } catch { return; } try { handle(m); } catch (e) { /* keep the stream alive */ } };
        ws.onclose = () => { setConn(false); scheduleReconnect(); };
        ws.onerror = () => { setConn(false); };
      }
      function setConn(on) { const d = document.querySelector(".topbar .dot"); if (d) d.classList.toggle("on", on); }
      function scheduleReconnect() {
        if (!token || reconnectTimer) return;   // only after we've paired
        reconnectTimer = setTimeout(() => { reconnectTimer = null; if (!ws || ws.readyState > 1) connect(); }, 2500);
      }
      function handle(m) {
        switch (m.type) {
          case "authed":
            planOn = Boolean(m.planMode); claudeConnected = Boolean(m.claude); setConn(true);
            // Only navigate on the FIRST auth. A transient reconnect must NOT throw
            // the user out of their current chat/list/settings screen.
            if (!booted) { booted = true; if (!m.consented) showConsent(); else afterConsent(); }
            break;
          case "consented": afterConsent(); break;
          case "needs_consent": showConsent(); break;
          case "list_result": dir = "none"; showList(m.scope, null, m.items); break;
          case "chat_opened": ctx = m.context || "Claude"; curKind = m.kind || "chat"; dir = "fwd"; showChat(); break;
          case "history": renderHistory(m.items || []); break;
          case "accepted": setSuggestions(null); showTyping(); setRunning(true); break;
          case "transcribing": setStatus("Transcribing…"); break;
          case "transcript": bubble("me", m.text || "(empty)"); setStatus(""); break;
          case "stream_start": startStream(); break;
          case "stream_delta": appendStream(m.text || ""); break;
          case "stream_filter": filterStream(); break;
          case "stream_end": endStream(); break;
          case "assistant": hideTyping(); if (m.streamed) reconcileAssistant(m); else { pendingAI += (m.text || "") + " "; bubble("ai", m.text, { report: !m.filtered, filtered: m.filtered }); } break;
          case "tool_use": hideTyping(); bubble("tool", m.name); showTyping(); break;
          case "progress": setStatus(m.text || ""); break;
          case "suggestion": if (m.text) setSuggestions([m.text]); break;
          case "needs_confirmation": hideTyping(); confirmCard(m.id, m.tool, m.command); break;
          case "turn_done": hideTyping(); setRunning(false); setStatus(""); speak(pendingAI.trim()); pendingAI = ""; buzz([16, 40, 22]); break;
          case "stopped": setRunning(false); hideTyping(); setStatus(""); break;
          case "plan_mode": planOn = Boolean(m.on); applyPlanClass(); toast(planOn ? "Plan mode on" : "Plan mode off"); break;
          case "model_set": toast("Model: " + ((m.model || "default").replace(/^claude-|-\d+$/g, "").replace(/-/g, " "))); break;
          case "usage_result": showUsage(m.usage); break;
          case "plan_usage_result": showPlanUsage(m.usage); break;
          case "models_result": showModelPicker(m.models); break;
          case "rewind_result": toast(m.ok ? `Undid last change${m.files ? " · " + m.files + " files" : ""}` : "Nothing to undo" + (m.error ? " (" + m.error + ")" : "")); break;
          // Claude acting on the watch:
          case "watch_action": watchAction(m); break;
          case "watch_query": watchQuery(m); break;
          // Session management results:
          case "session_renamed": toast("Renamed"); wsend({ type: "list", scope: "chats" }); break;
          case "session_deleted": toast("Deleted"); wsend({ type: "list", scope: "chats" }); break;
          // Account & settings:
          case "account_result": fillAccount(m.account); break;
          case "settings_result": {
            lang = m.language || ""; notifOn = m.notifications !== false; planOn = Boolean(m.planMode);
            const seg = document.getElementById("segLang"); if (seg) seg.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x.dataset.l === lang));
            document.querySelectorAll(".setrow").forEach((r) => { if (r.dataset.a === "plan") r.querySelector(".switch")?.classList.toggle("on", planOn); if (r.dataset.a === "notif") r.querySelector(".switch")?.classList.toggle("on", notifOn); });
            break;
          }
          case "language_set": break;
          case "notifications_set": break;
          case "stt_unavailable": hideTyping(); setRunning(false); bubble("ai", "Voice is not configured on the server.", { filtered: true }); break;
          case "error":
            hideTyping(); setRunning(false);
            // Device session token expired → stop reconnecting and re-pair.
            if (/invalid or expired token/i.test(String(m.message))) { token = null; if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; } booted = false; showPairing(); renewPairing(); break; }
            if (/not connected/i.test(String(m.message))) { claudeConnected = false; showConnectClaude(); break; }
            bubble("ai", "Error: " + m.message, { filtered: true });
            if (/oauth|401|unauthor|invalid api key|credit balance|authentication|expired/i.test(String(m.message))) { showNotif("Reconnect Claude", "Open /connect on your phone"); }
            break;
        }
      }
      boot();
    </script>
  </body>
</html>
