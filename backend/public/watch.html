<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claude Code — Watch Ultimate 2</title>
    <style>
      /* --- Claude design tokens (warm dark theme) --- */
      :root {
        --bg: #262624;          /* main surface (Claude dark) */
        --surface: #1f1e1d;     /* rows / panels */
        --surface-2: #30302e;   /* raised / focus */
        --ink: #f5f4ee;         /* primary text (warm off-white) */
        --muted: #b1ada1;       /* Cloudy */
        --faint: #83817b;
        --clay: #d97757;        /* Claude accent */
        --clay-deep: #c15f3c;   /* Crail */
        --clay-tint: rgba(217,119,87,.16);
        --border: #3a3936;
        --on-clay: #2a1a12;
        color-scheme: dark;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body {
        margin: 0; min-height: 100vh; background: #171614; color: var(--ink);
        font-family: "Styrene A", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex; flex-direction: column; align-items: center; gap: 1.1rem; padding: 2rem 1rem;
      }
      .serif { font-family: Copernicus, "Tiempos Text", Georgia, "Times New Roman", serif; }
      .caption { color: var(--faint); font-size: .8rem; text-align: center; max-width: 27rem; line-height: 1.5; }
      .caption b { color: var(--muted); font-weight: 600; }

      /* --- Round watch body --- */
      .watch { position: relative; }
      .bezel {
        width: 360px; height: 360px; border-radius: 50%;
        background: radial-gradient(circle at 50% 28%, #3a3a37, #141311 72%);
        padding: 13px; box-shadow: 0 24px 70px rgba(0,0,0,.65), inset 0 0 0 2px #4a4844;
      }
      .crown {
        position: absolute; right: -9px; width: 12px; border-radius: 5px;
        background: linear-gradient(#5a564f, #2b2926); cursor: pointer;
        transition: box-shadow .15s;
      }
      .crown.upper { top: 116px; height: 52px; }
      .crown.upper.pulse { box-shadow: 0 0 0 5px var(--clay-tint); }
      .crown.lower { top: 198px; height: 34px; }
      .crownlabel { position: absolute; right: 15px; top: 90px; font-size: .58rem; color: var(--faint); }

      .screen {
        width: 100%; height: 100%; border-radius: 50%; overflow: hidden;
        background: var(--bg); position: relative; display: flex; flex-direction: column;
        touch-action: none;
      }
      .safe { position: absolute; inset: 38px; display: flex; flex-direction: column; }

      .statusbar { display: flex; align-items: center; justify-content: center; gap: .4rem;
        font-size: .68rem; color: var(--muted); padding-top: .05rem; letter-spacing: .02em; }
      .dot { width: .42rem; height: .42rem; border-radius: 50%; background: var(--faint); }
      .dot.on { background: #7bbd8a; }
      .proj { color: var(--clay); max-width: 8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .demoTag { color: var(--muted); }

      .view { flex: 1; min-height: 0; display: flex; flex-direction: column; animation: fade .18s ease; }
      @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

      .center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; gap: .7rem; }
      h2 { font-size: 1.05rem; margin: 0; font-weight: 500; }
      p.small { font-size: .76rem; color: var(--muted); margin: 0; line-height: 1.45; max-width: 14rem; }

      /* Logo (Claude sunburst) */
      .logo { display: flex; flex-direction: column; align-items: center; gap: .35rem; }
      .logo .word { font-size: 1.15rem; letter-spacing: .01em; }
      svg { display: block; }
      .burst line { stroke: var(--clay); stroke-width: 2.1; stroke-linecap: round; }

      .qr img { width: 138px; height: 138px; border-radius: 12px; background: #fff; padding: 5px; }
      .usercode { font-family: ui-monospace, monospace; letter-spacing: .16em; font-size: 1rem; color: var(--ink); }

      button.pill { border: none; border-radius: 999px; padding: .62rem 1.3rem; font-size: .85rem;
        font-weight: 600; background: var(--clay); color: var(--on-clay); cursor: pointer; }
      button.pill:active { background: var(--clay-deep); }

      /* Header with back */
      .hdr { display: flex; align-items: center; gap: .35rem; font-size: .9rem; font-weight: 500;
        padding: 0 0 .35rem; color: var(--ink); }
      .hdr .ttl { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .iconbtn { background: none; border: none; color: var(--muted); cursor: pointer; padding: 2px;
        display: grid; place-items: center; }
      .iconbtn:active { color: var(--ink); }

      /* Lists / tiles */
      .list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: .4rem; padding: .1rem;
        scrollbar-width: none; }
      .list::-webkit-scrollbar { display: none; }
      .row { display: flex; align-items: center; gap: .6rem; background: var(--surface); border-radius: 14px;
        padding: .6rem .65rem; cursor: pointer; border: 1.5px solid transparent; transition: background .12s, border-color .12s; }
      .row .ic { color: var(--clay); flex: 0 0 auto; display: grid; place-items: center; }
      .row .tx { flex: 1; min-width: 0; }
      .row .t { font-size: .86rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .row .s { font-size: .68rem; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .row .chev { color: var(--faint); flex: 0 0 auto; }
      .row.focus { border-color: var(--clay); background: var(--surface-2); }
      .row:active { background: var(--surface-2); }
      .empty { color: var(--faint); font-size: .78rem; text-align: center; padding-top: 1.2rem; }

      /* Chat */
      .feed { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: .45rem; padding: .25rem .05rem;
        scrollbar-width: none; }
      .feed::-webkit-scrollbar { display: none; }
      .msg { display: flex; gap: .4rem; align-items: flex-start; }
      .msg .av { flex: 0 0 auto; margin-top: 2px; }
      .bubble { font-size: .8rem; line-height: 1.4; padding: .5rem .65rem; border-radius: 14px; position: relative;
        max-width: 100%; word-break: break-word; }
      .me { align-self: flex-end; background: var(--clay-tint); border: 1px solid rgba(217,119,87,.35);
        border-bottom-right-radius: 5px; max-width: 88%; }
      .ai .bubble { background: var(--surface); border-bottom-left-radius: 5px; flex: 1; }
      .ai.filtered .bubble { background: #3a201c; color: #f0b3a6; }
      .tool { font-family: ui-monospace, monospace; font-size: .68rem; color: var(--clay); background: var(--surface);
        padding: .35rem .55rem; border-radius: 10px; display: inline-flex; align-items: center; gap: .35rem; }
      .flag { position: absolute; top: 3px; right: 6px; color: var(--faint); cursor: pointer; display: inline-grid; }

      .dock { display: flex; align-items: center; justify-content: center; gap: .55rem; padding-top: .45rem; }
      .mic { width: 56px; height: 56px; border-radius: 50%; border: none; cursor: pointer;
        background: radial-gradient(circle at 50% 32%, #e58a68, var(--clay-deep)); color: var(--on-clay);
        display: grid; place-items: center; transition: transform .08s, box-shadow .15s; touch-action: none; }
      .mic.rec { transform: scale(1.09); box-shadow: 0 0 0 9px var(--clay-tint); }
      .kbd { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface);
        color: var(--muted); display: grid; place-items: center; cursor: pointer; }
      .hint { font-size: .68rem; color: var(--faint); text-align: center; padding-top: .25rem; min-height: 1rem; }
      .typing { display: flex; gap: .35rem; }
      .typing input { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--border); color: var(--ink);
        border-radius: 999px; padding: .48rem .75rem; font-size: .8rem; }
      .typing input::placeholder { color: var(--faint); }
      .typing button { border: none; background: var(--clay); color: var(--on-clay); border-radius: 999px;
        padding: 0 .85rem; font-weight: 700; cursor: pointer; }

      pre.code { flex: 1; overflow: auto; margin: 0; font-family: ui-monospace, monospace; font-size: .68rem;
        line-height: 1.45; color: #d8d4ca; white-space: pre; padding: .3rem; }

      .toolbar { display: flex; gap: .8rem; }
      .toolbar button { background: var(--surface); border: 1px solid var(--border); color: var(--muted);
        border-radius: 999px; padding: .4rem .9rem; font-size: .8rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="watch">
      <div class="bezel">
        <div class="screen" id="screen">
          <div class="safe">
            <div class="statusbar">
              <span class="dot" id="dot"></span>
              <span id="clock">--:--</span>
              <span class="proj" id="projTag"></span>
              <span class="demoTag" id="demoTag"></span>
            </div>
            <div class="view" id="view"></div>
          </div>
        </div>
      </div>
      <div class="crownlabel">snurra / tryck</div>
      <div class="crown upper" id="crown" title="Digital Crown — snurra för att navigera, tryck för att välja"></div>
      <div class="crown lower" id="crownBack" title="Nedre knapp — tillbaka"></div>
    </div>

    <div class="toolbar">
      <button id="ttsBtn">Uppläsning: på</button>
      <button id="resetBtn">Starta om</button>
    </div>
    <p class="caption">
      Watch Ultimate 2 · Claude-design. Navigera med <b>touch</b> eller den övre
      <b>kronan</b> (snurra = flytta / scrolla, tryck = välj; nedre knapp = tillbaka).
      I webbläsaren emuleras kronan med <b>mushjul</b> + klick på kronan.
    </p>

    <script>
      // --- Icon set (Claude-style thin line icons) ---
      const I = {
        chat: 'M4 5.5h16a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H9l-4 3.5V6.5a1 1 0 0 1 1-1z',
        folder: 'M3 6.5A1.5 1.5 0 0 1 4.5 5h4l2 2h7A1.5 1.5 0 0 1 19 8.5v8A1.5 1.5 0 0 1 17.5 18h-13A1.5 1.5 0 0 1 3 16.5z',
      };
      function icon(name, size = 22) {
        const s = `width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"`;
        switch (name) {
          case "chat": return `<svg ${s}><path d="${I.chat}"/></svg>`;
          case "folder": return `<svg ${s}><path d="${I.folder}"/></svg>`;
          case "code": return `<svg ${s}><polyline points="8.5 8 4.5 12 8.5 16"/><polyline points="15.5 8 19.5 12 15.5 16"/></svg>`;
          case "back": return `<svg ${s}><polyline points="14.5 5 8 12 14.5 19"/></svg>`;
          case "chev": return `<svg ${s}><polyline points="9.5 6 15 12 9.5 18"/></svg>`;
          case "plus": return `<svg ${s}><line x1="12" y1="6" x2="12" y2="18"/><line x1="6" y1="12" x2="18" y2="12"/></svg>`;
          case "mic": return `<svg ${s}><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><line x1="12" y1="17.5" x2="12" y2="21"/></svg>`;
          case "kbd": return `<svg ${s}><rect x="3" y="7" width="18" height="10" rx="2"/><line x1="7" y1="11" x2="7" y2="11"/><line x1="11" y1="11" x2="11" y2="11"/><line x1="15" y1="11" x2="15" y2="11"/><line x1="8" y1="14" x2="16" y2="14"/></svg>`;
          case "term": return `<svg ${s}><polyline points="6 8 10 12 6 16"/><line x1="12" y1="16" x2="18" y2="16"/></svg>`;
          case "file": return `<svg ${s}><path d="M7 3h7l4 4v14H7z"/><polyline points="14 3 14 7 18 7"/></svg>`;
          case "flag": return `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V5a1 1 0 0 1 1-1h11l-2 4 2 4H6"/></svg>`;
        }
        return "";
      }
      // Claude sunburst mark (radial spokes in clay)
      function burst(size = 44) {
        const cx = 12, cy = 12, r0 = 3.4, r1 = 8.8, spokes = 12;
        let lines = "";
        for (let i = 0; i < spokes; i++) {
          const a = (i * 2 * Math.PI) / spokes;
          const x1 = cx + r0 * Math.cos(a), y1 = cy + r0 * Math.sin(a);
          const x2 = cx + r1 * Math.cos(a), y2 = cy + r1 * Math.sin(a);
          lines += `<line x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}"/>`;
        }
        return `<svg class="burst" width="${size}" height="${size}" viewBox="0 0 24 24">${lines}</svg>`;
      }

      const view = document.getElementById("view");
      const dot = document.getElementById("dot");
      let meta = { demoMode: false, stt: false };
      let deviceCode = null, token = null, ws = null, pollTimer = null;
      let ttsOn = true, recorder = null, chunks = [], recMime = "audio/webm";
      let pendingAI = "", project = "workspace";
      const nav = { mode: "select", focusables: [], idx: 0, scrollEl: null };

      setInterval(() => {
        const d = new Date();
        document.getElementById("clock").textContent =
          String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
      }, 1000);

      document.getElementById("ttsBtn").addEventListener("click", (e) => {
        ttsOn = !ttsOn; e.target.textContent = "Uppläsning: " + (ttsOn ? "på" : "av");
        if (!ttsOn) speechSynthesis.cancel();
      });
      document.getElementById("resetBtn").addEventListener("click", () => location.reload());

      function speak(text) {
        if (!ttsOn || !text) return;
        const short = text.split(/(?<=[.!?])\s/)[0].slice(0, 160);
        const u = new SpeechSynthesisUtterance(short); u.lang = "sv-SE";
        speechSynthesis.cancel(); speechSynthesis.speak(u);
      }

      // --- Crown / touch nav ---
      function registerFocus() { nav.focusables = [...view.querySelectorAll("[data-focus]")]; nav.idx = 0; applyFocus(); }
      function applyFocus() {
        nav.focusables.forEach((el, i) => el.classList.toggle("focus", i === nav.idx));
        nav.focusables[nav.idx]?.scrollIntoView({ block: "nearest" });
      }
      function rotate(delta) {
        if (nav.mode === "scroll" && nav.scrollEl) { nav.scrollEl.scrollTop += delta * 40; return; }
        if (!nav.focusables.length) return;
        nav.idx = (nav.idx + (delta > 0 ? 1 : -1) + nav.focusables.length) % nav.focusables.length;
        applyFocus();
      }
      function press() { if (nav.mode === "select") nav.focusables[nav.idx]?.click(); }
      document.getElementById("screen").addEventListener("wheel", (e) => { e.preventDefault(); rotate(e.deltaY); }, { passive: false });
      const crown = document.getElementById("crown");
      crown.addEventListener("click", () => { crown.classList.add("pulse"); setTimeout(() => crown.classList.remove("pulse"), 160); press(); });
      document.getElementById("crownBack").addEventListener("click", () => back());
      window.addEventListener("keydown", (e) => {
        if (e.target.tagName === "INPUT") return;
        if (e.key === "ArrowDown") rotate(1); else if (e.key === "ArrowUp") rotate(-1);
        else if (e.key === "Enter") press(); else if (e.key === "Escape" || e.key === "Backspace") back();
      });
      let backStack = [];
      function back() { const prev = backStack.pop(); if (prev) prev(); }

      // --- Screens ---
      function setProjTag() { document.getElementById("projTag").textContent = project ? "· " + project : ""; }

      function showPairing() {
        nav.mode = "scroll"; nav.scrollEl = null; backStack = [];
        view.innerHTML = `<div class="center">
          ${burst(46)}
          <h2 class="serif">Para ihop</h2>
          <div class="qr" id="qr"></div>
          <div class="usercode" id="uc"></div>
          <p class="small">Skanna med mobilen och godkänn.</p></div>`;
      }
      function showConsent() {
        nav.mode = "select";
        view.innerHTML = `<div class="center">
          ${burst(40)}
          <h2 class="serif">Innan vi börjar</h2>
          <p class="small">Det du säger skickas till backend och Anthropic för att köra Claude Code. Inget sparas längre än nödvändigt.</p>
          <button class="pill" data-focus id="consentBtn">Godkänn &amp; fortsätt</button></div>`;
        document.getElementById("consentBtn").onclick = () => ws.send(JSON.stringify({ type: "consent" }));
        registerFocus();
      }

      function tileRow(go, ico, title, sub) {
        return `<div class="row" data-focus data-go="${go}">
          <span class="ic">${icon(ico)}</span>
          <span class="tx"><div class="t">${title}</div><div class="s">${sub}</div></span>
          <span class="chev">${icon("chev", 18)}</span></div>`;
      }
      function showHome() {
        nav.mode = "select"; backStack = []; setProjTag();
        view.innerHTML = `
          <div class="hdr" style="justify-content:center;gap:.45rem">${burst(22)}<span class="serif ttl" style="flex:0">Claude</span></div>
          <div class="list">
            ${tileRow("chats", "chat", "Chats", "tidigare samtal")}
            ${tileRow("projects", "folder", "Projects", "välj repo")}
            ${tileRow("code", "code", "Code", "bläddra i filer")}
          </div>`;
        view.querySelectorAll("[data-go]").forEach((el) => el.addEventListener("click", () => openMode(el.dataset.go)));
        registerFocus();
      }

      function openMode(scope) { backStack.push(showHome); showList(scope, "…"); ws.send(JSON.stringify({ type: "list", scope })); }

      function listRow(ico, id, title, sub) {
        return `<div class="row" data-focus data-id="${encodeURIComponent(id)}">
          <span class="ic">${icon(ico, 20)}</span>
          <span class="tx"><div class="t">${esc(title)}</div><div class="s">${esc(sub || "")}</div></span>
          <span class="chev">${icon("chev", 18)}</span></div>`;
      }
      function showList(scope, statusText, items) {
        nav.mode = "select";
        const titles = { chats: "Chats", projects: "Projects", code: "Code" };
        const ico = { chats: "chat", projects: "folder", code: "file" }[scope] || "chat";
        const newRow = scope === "chats"
          ? `<div class="row" data-focus id="newChat"><span class="ic">${icon("plus", 20)}</span><span class="tx"><div class="t">Ny chatt</div><div class="s">starta nytt samtal</div></span></div>` : "";
        const body = items
          ? (items.length || scope === "chats"
              ? newRow + items.map((it) => listRow(ico, it.id, it.title, it.subtitle)).join("")
              : `<div class="empty">Inget här än</div>`)
          : `<div class="empty">${esc(statusText || "…")}</div>`;
        view.innerHTML = `<div class="hdr"><button class="iconbtn" data-back>${icon("back", 20)}</button><span class="ttl">${titles[scope] || scope}</span></div><div class="list" id="list">${body}</div>`;
        view.querySelector("[data-back]").onclick = () => back();
        const nc = document.getElementById("newChat");
        if (nc) nc.onclick = () => ws.send(JSON.stringify({ type: "new_chat" }));
        view.querySelectorAll("[data-id]").forEach((el) => el.addEventListener("click", () => onPick(scope, decodeURIComponent(el.dataset.id))));
        registerFocus();
      }
      function onPick(scope, id) {
        if (scope === "projects") ws.send(JSON.stringify({ type: "select_project", id }));
        else if (scope === "chats") ws.send(JSON.stringify({ type: "open_chat", id }));
        else if (scope === "code") ws.send(JSON.stringify({ type: "open_file", id }));
      }

      function showFile(path, content) {
        nav.mode = "scroll";
        view.innerHTML = `<div class="hdr"><button class="iconbtn" data-back>${icon("back", 20)}</button><span class="ttl">${esc(path.split("/").pop())}</span></div><pre class="code" id="code"></pre>`;
        document.getElementById("code").textContent = content;
        nav.scrollEl = document.getElementById("code");
        view.querySelector("[data-back]").onclick = () => back();
        backStack.push(() => openMode("code"));
      }

      function showChat() {
        nav.mode = "scroll"; setProjTag();
        const micUi = meta.stt ? `<button class="mic" id="mic" title="Håll för att tala">${icon("mic", 24)}</button>`
          : `<span class="hint">Röst ej konfigurerad</span>`;
        view.innerHTML = `
          <div class="hdr"><button class="iconbtn" data-back>${icon("back", 20)}</button><span class="ttl serif">${esc(project)}</span></div>
          <div class="feed" id="feed"></div>
          <div class="dock"><button class="kbd" id="kbd" title="Skriv">${icon("kbd", 20)}</button>${micUi}</div>
          <div class="hint" id="hint">${meta.stt ? "Håll mic och tala · snurra för att scrolla" : "Skriv nedan"}</div>
          <div class="typing" id="typing" style="display:none"><input id="text" placeholder="Skriv till Claude…" /><button id="sendBtn">${icon("chev", 18)}</button></div>`;
        nav.scrollEl = document.getElementById("feed");
        view.querySelector("[data-back]").onclick = () => showHome();
        backStack = [showHome];
        wireChat();
      }

      function bubble(kind, text, opts = {}) {
        const feed = document.getElementById("feed"); if (!feed) return;
        const wrap = document.createElement("div");
        if (kind === "me") {
          wrap.className = "msg"; wrap.style.justifyContent = "flex-end";
          wrap.innerHTML = `<div class="bubble me">${esc(text)}</div>`;
        } else if (kind === "tool") {
          wrap.className = "msg"; wrap.innerHTML = `<span class="tool">${icon("term", 14)} ${esc(text)}</span>`;
        } else {
          const filtered = opts.filtered ? " filtered" : "";
          wrap.className = "msg ai" + filtered;
          const flag = opts.report ? `<span class="flag" title="Rapportera">${icon("flag")}</span>` : "";
          wrap.innerHTML = `<span class="av">${burst(18)}</span><div class="bubble">${esc(text)}${flag}</div>`;
          if (opts.report) wrap.querySelector(".flag").onclick = (ev) => {
            ws.send(JSON.stringify({ type: "report", text, reason: "user_report" })); ev.currentTarget.textContent = "✓";
          };
        }
        feed.appendChild(wrap); feed.scrollTop = feed.scrollHeight;
      }

      function wireChat() {
        const typing = document.getElementById("typing");
        document.getElementById("kbd").onclick = () => {
          typing.style.display = typing.style.display === "none" ? "flex" : "none";
          if (typing.style.display === "flex") document.getElementById("text").focus();
        };
        const sendText = () => {
          const t = document.getElementById("text").value.trim(); if (!t) return;
          bubble("me", t); ws.send(JSON.stringify({ type: "prompt", text: t }));
          document.getElementById("text").value = "";
        };
        document.getElementById("sendBtn").onclick = sendText;
        document.getElementById("text").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.stopPropagation(); sendText(); } });

        const mic = document.getElementById("mic");
        if (mic) {
          const start = async (e) => {
            e.preventDefault();
            try {
              const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
              recMime = MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm" : "";
              recorder = new MediaRecorder(stream, recMime ? { mimeType: recMime } : undefined);
              chunks = []; recorder.ondataavailable = (ev) => ev.data.size && chunks.push(ev.data);
              recorder.onstop = sendAudio; recorder.start(); mic.classList.add("rec");
              document.getElementById("hint").textContent = "Lyssnar… släpp för att skicka";
            } catch { document.getElementById("hint").textContent = "Mikrofon nekad"; }
          };
          const stop = (e) => { e && e.preventDefault(); mic.classList.remove("rec"); if (recorder && recorder.state !== "inactive") recorder.stop(); };
          mic.addEventListener("pointerdown", start);
          mic.addEventListener("pointerup", stop);
          mic.addEventListener("pointerleave", stop);
        }
      }

      async function sendAudio() {
        const blob = new Blob(chunks, { type: recMime || "audio/webm" });
        const buf = new Uint8Array(await blob.arrayBuffer());
        let bin = ""; for (const b of buf) bin += String.fromCharCode(b);
        document.getElementById("hint").textContent = "Transkriberar…";
        ws.send(JSON.stringify({ type: "audio_start", mime: recMime || "audio/webm" }));
        ws.send(JSON.stringify({ type: "audio_chunk", data: btoa(bin) }));
        ws.send(JSON.stringify({ type: "audio_end" }));
      }

      const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

      // --- Flow ---
      async function boot() {
        meta = await (await fetch("/meta")).json();
        document.getElementById("demoTag").textContent = meta.demoMode ? "· DEMO" : "";
        showPairing();
        const dc = await (await fetch("/device/code", { method: "POST" })).json();
        deviceCode = dc.device_code;
        document.getElementById("qr").innerHTML = '<img src="' + dc.qr_data_url + '">';
        document.getElementById("uc").textContent = dc.user_code;
        startPolling(dc.interval);
      }
      function startPolling(intervalS) {
        clearInterval(pollTimer);
        pollTimer = setInterval(async () => {
          const r = await fetch("/device/token", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ device_code: deviceCode }) });
          const data = await r.json();
          if (data.status === "approved") { clearInterval(pollTimer); token = data.access_token; connect(); }
          else if (data.status === "expired_token") { clearInterval(pollTimer); showPairing(); }
        }, (intervalS || 3) * 1000);
      }
      function connect() {
        const proto = location.protocol === "https:" ? "wss" : "ws";
        ws = new WebSocket(proto + "://" + location.host + "/ws");
        ws.onopen = () => { dot.classList.add("on"); ws.send(JSON.stringify({ type: "auth", token })); };
        ws.onclose = () => dot.classList.remove("on");
        ws.onmessage = (ev) => handle(JSON.parse(ev.data));
      }
      function handle(m) {
        switch (m.type) {
          case "authed": project = m.project || "workspace"; if (m.consented) showHome(); else showConsent(); break;
          case "consented": showHome(); break;
          case "needs_consent": showConsent(); break;
          case "list_result": showList(m.scope, null, m.items); break;
          case "project_selected": project = m.title; showHome(); break;
          case "chat_opened": showChat(); break;
          case "file": showFile(m.path, m.content); break;
          case "transcribing": { const h = document.getElementById("hint"); if (h) h.textContent = "Transkriberar…"; break; }
          case "transcript": bubble("me", m.text || "(tomt)"); { const h = document.getElementById("hint"); if (h) h.textContent = ""; } break;
          case "assistant": pendingAI += (m.text || "") + " "; bubble("ai", m.text, { report: !m.filtered, filtered: m.filtered }); break;
          case "tool_use": bubble("tool", m.name); break;
          case "needs_confirmation": bubble("ai", "Kräver bekräftelse: " + m.command, { filtered: true }); break;
          case "turn_done": speak(pendingAI.trim()); pendingAI = ""; break;
          case "stt_unavailable": bubble("ai", "Röst är inte konfigurerad på servern.", { filtered: true }); break;
          case "error": bubble("ai", "Fel: " + m.message, { filtered: true }); break;
        }
      }

      boot();
    </script>
  </body>
</html>
