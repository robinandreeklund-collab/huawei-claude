<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claude Code — Watch Ultimate 2 (demo)</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body {
        margin: 0; min-height: 100vh; background: #05060a; color: #e8eaed;
        font-family: system-ui, -apple-system, sans-serif;
        display: flex; flex-direction: column; align-items: center; gap: 1rem;
        padding: 2rem 1rem;
      }
      .caption { color: #6b7280; font-size: .8rem; text-align: center; max-width: 26rem; }

      .watch { position: relative; }
      .bezel {
        width: 360px; height: 360px; border-radius: 50%;
        background: radial-gradient(circle at 50% 30%, #2a2d34, #0c0d10 70%);
        padding: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.6), inset 0 0 0 2px #3a3f48;
      }
      .crown {
        position: absolute; right: -9px; width: 12px; border-radius: 4px;
        background: linear-gradient(#4a4f58, #23262c); cursor: pointer;
      }
      .crown.upper { top: 118px; height: 50px; }
      .crown.upper.pulse { box-shadow: 0 0 0 4px rgba(217,119,87,.4); }
      .crown.lower { top: 196px; height: 34px; }
      .crownlabel { position: absolute; right: 14px; top: 92px; font-size: .6rem; color: #6b7280; }
      .screen {
        width: 100%; height: 100%; border-radius: 50%; overflow: hidden;
        background: #000; position: relative; display: flex; flex-direction: column;
        touch-action: none;
      }
      .safe { position: absolute; inset: 40px; display: flex; flex-direction: column; }

      .statusbar { display: flex; align-items: center; justify-content: center; gap: .4rem;
        font-size: .7rem; color: #9aa3b2; padding-top: .1rem; }
      .dot { width: .5rem; height: .5rem; border-radius: 50%; background: #6b7280; }
      .dot.on { background: #7bd88f; }
      .proj { color: #7fb2ff; max-width: 8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .demoTag { color: #d9a77c; }

      .view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
      .center { flex: 1; display: flex; flex-direction: column; align-items: center;
        justify-content: center; text-align: center; gap: .6rem; }
      h2 { font-size: 1rem; margin: 0; }
      p.small { font-size: .78rem; color: #9aa3b2; margin: 0; line-height: 1.4; }
      .qr img { width: 150px; height: 150px; border-radius: 10px; background: #fff; padding: 4px; }
      .usercode { font-family: ui-monospace, monospace; letter-spacing: .12em; font-size: 1rem; }
      button.pill { border: none; border-radius: 999px; padding: .6rem 1.2rem; font-size: .85rem;
        font-weight: 600; background: #d97757; color: #1a1205; cursor: pointer; }

      /* Header row with back */
      .hdr { display: flex; align-items: center; gap: .4rem; font-size: .82rem; font-weight: 600;
        padding-bottom: .3rem; }
      .back { background: none; border: none; color: #9aa3b2; font-size: 1rem; cursor: pointer; }

      /* Scroll list / tiles */
      .list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: .35rem;
        padding: .1rem; scrollbar-width: none; }
      .list::-webkit-scrollbar { display: none; }
      .row { background: #12161d; border-radius: 12px; padding: .5rem .6rem; cursor: pointer;
        border: 2px solid transparent; }
      .row .t { font-size: .84rem; }
      .row .s { font-size: .68rem; color: #6b7280; }
      .row.focus { border-color: #d97757; background: #1a2029; }
      .tile { display: flex; align-items: center; gap: .6rem; }
      .tile .ico { font-size: 1.2rem; }
      .empty { color: #6b7280; font-size: .78rem; text-align: center; padding-top: 1rem; }

      /* Chat feed */
      .feed { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: .4rem;
        padding: .2rem .1rem; scrollbar-width: none; }
      .feed::-webkit-scrollbar { display: none; }
      .bubble { font-size: .8rem; line-height: 1.35; padding: .45rem .6rem; border-radius: 12px; position: relative; }
      .me { background: #1c2431; align-self: flex-end; max-width: 90%; }
      .ai { background: #14181f; }
      .ai.filtered { background: #2a1618; color: #ff9d95; }
      .tool { font-family: ui-monospace, monospace; font-size: .68rem; color: #d9a77c;
        background: #1a140f; padding: .3rem .5rem; border-radius: 9px; }
      .flag { position: absolute; top: 2px; right: 6px; font-size: .7rem; color: #6b7280; cursor: pointer; }

      .dock { display: flex; align-items: center; justify-content: center; gap: .5rem; padding-top: .4rem; }
      .mic { width: 54px; height: 54px; border-radius: 50%; border: none; cursor: pointer;
        background: radial-gradient(circle at 50% 35%, #e08a6a, #c15a3a); color: #1a1205; font-size: 1.3rem;
        display: grid; place-items: center; transition: transform .08s, box-shadow .15s; touch-action: none; }
      .mic.rec { transform: scale(1.08); background: radial-gradient(circle at 50% 35%, #ff6b6b, #c0392b);
        box-shadow: 0 0 0 8px rgba(217,119,87,.25); }
      .kbd { width: 38px; height: 38px; border-radius: 50%; border: 1px solid #2a2f38; background: #14181f;
        color: #9aa3b2; font-size: 1rem; cursor: pointer; }
      .hint { font-size: .68rem; color: #6b7280; text-align: center; padding-top: .2rem; min-height: 1rem; }
      .typing { display: flex; gap: .3rem; }
      .typing input { flex: 1; min-width: 0; background: #0f1319; border: 1px solid #2a2f38; color: #e8eaed;
        border-radius: 999px; padding: .45rem .7rem; font-size: .8rem; }
      .typing button { border: none; background: #d97757; color: #1a1205; border-radius: 999px;
        padding: 0 .8rem; font-weight: 700; cursor: pointer; }

      pre.code { flex: 1; overflow: auto; margin: 0; font-family: ui-monospace, monospace; font-size: .68rem;
        line-height: 1.4; color: #cdd3dc; white-space: pre; }

      .toolbar { display: flex; gap: 1rem; margin-top: .5rem; }
      .toolbar button { background: none; border: 1px solid #2a2f38; color: #9aa3b2; border-radius: 999px;
        padding: .35rem .8rem; font-size: .8rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="watch">
      <div class="bezel">
        <div class="screen" id="screen">
          <div class="safe">
            <div class="statusbar">
              <span class="dot" id="dot"></span>
              <span id="clock">--:--</span>
              <span class="proj" id="projTag"></span>
              <span class="demoTag" id="demoTag"></span>
            </div>
            <div class="view" id="view"></div>
          </div>
        </div>
      </div>
      <div class="crownlabel">snurra / tryck</div>
      <div class="crown upper" id="crown" title="Digital Crown — snurra för att navigera, tryck för att välja"></div>
      <div class="crown lower" id="crownBack" title="Nedre knapp — tillbaka"></div>
    </div>

    <div class="toolbar">
      <button id="ttsBtn">🔊 Uppläsning: på</button>
      <button id="resetBtn">↺ Starta om</button>
    </div>
    <p class="caption">
      Watch Ultimate 2-demo. Navigera med <b>touch</b> eller den övre <b>kronan</b>
      (snurra = flytta markering / scrolla, tryck = välj; nedre knapp = tillbaka).
      I webbläsaren emuleras kronan med <b>mushjulet</b> + klick på kronan.
      Tre lägen: <b>Chats · Projects · Code</b>.
    </p>

    <script>
      const view = document.getElementById("view");
      const dot = document.getElementById("dot");
      let meta = { demoMode: false, stt: false };
      let deviceCode = null, token = null, ws = null, pollTimer = null;
      let ttsOn = true, recorder = null, chunks = [], recMime = "audio/webm";
      let pendingAI = "", project = "workspace";

      // Navigation controller (crown + touch). navMode: 'select' (lists/tiles) or 'scroll'.
      const nav = { mode: "select", focusables: [], idx: 0, scrollEl: null };

      setInterval(() => {
        const d = new Date();
        document.getElementById("clock").textContent =
          String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
      }, 1000);

      document.getElementById("ttsBtn").addEventListener("click", (e) => {
        ttsOn = !ttsOn; e.target.textContent = "🔊 Uppläsning: " + (ttsOn ? "på" : "av");
        if (!ttsOn) speechSynthesis.cancel();
      });
      document.getElementById("resetBtn").addEventListener("click", () => location.reload());

      function speak(text) {
        if (!ttsOn || !text) return;
        const short = text.split(/(?<=[.!?])\s/)[0].slice(0, 160);
        const u = new SpeechSynthesisUtterance(short); u.lang = "sv-SE";
        speechSynthesis.cancel(); speechSynthesis.speak(u);
      }

      // ---- Crown / touch input ----
      function registerFocus() {
        nav.focusables = [...view.querySelectorAll("[data-focus]")];
        nav.idx = 0; applyFocus();
      }
      function applyFocus() {
        nav.focusables.forEach((el, i) => el.classList.toggle("focus", i === nav.idx));
        nav.focusables[nav.idx]?.scrollIntoView({ block: "nearest" });
      }
      function rotate(delta) {
        if (nav.mode === "scroll" && nav.scrollEl) { nav.scrollEl.scrollTop += delta * 40; return; }
        if (!nav.focusables.length) return;
        nav.idx = (nav.idx + (delta > 0 ? 1 : -1) + nav.focusables.length) % nav.focusables.length;
        applyFocus();
      }
      function press() { if (nav.mode === "select") nav.focusables[nav.idx]?.click(); }

      // On real HarmonyOS these bind to onDigitalCrown (rotation) + key events; in the
      // browser we stand in with the mouse wheel and a clickable crown element.
      document.getElementById("screen").addEventListener("wheel", (e) => { e.preventDefault(); rotate(e.deltaY); }, { passive: false });
      const crown = document.getElementById("crown");
      crown.addEventListener("click", () => { crown.classList.add("pulse"); setTimeout(() => crown.classList.remove("pulse"), 150); press(); });
      document.getElementById("crownBack").addEventListener("click", () => back());
      window.addEventListener("keydown", (e) => {
        if (e.key === "ArrowDown") rotate(1);
        else if (e.key === "ArrowUp") rotate(-1);
        else if (e.key === "Enter") press();
        else if (e.key === "Escape" || e.key === "Backspace") back();
      });

      let backStack = [];
      function back() { const prev = backStack.pop(); if (prev) prev(); }

      // ---- Screens ----
      function setProjTag() { document.getElementById("projTag").textContent = project ? "· " + project : ""; }

      function showPairing() {
        nav.mode = "scroll"; nav.scrollEl = null; backStack = [];
        view.innerHTML = `<div class="center">
          <h2>Para ihop klockan</h2><div class="qr" id="qr"></div>
          <div class="usercode" id="uc"></div>
          <p class="small">Skanna med mobilen och godkänn.</p></div>`;
      }
      function showConsent() {
        nav.mode = "select";
        view.innerHTML = `<div class="center">
          <h2>Innan vi börjar</h2>
          <p class="small">Det du säger skickas till backend och Anthropic (USA) för att köra
            Claude Code. Inget sparas längre än nödvändigt.</p>
          <button class="pill" data-focus id="consentBtn">Godkänn & fortsätt</button></div>`;
        document.getElementById("consentBtn").onclick = () => ws.send(JSON.stringify({ type: "consent" }));
        registerFocus();
      }

      function showHome() {
        nav.mode = "select"; backStack = []; setProjTag();
        view.innerHTML = `
          <div class="hdr">Claude</div>
          <div class="list">
            <div class="row tile" data-focus data-go="chats"><span class="ico">💬</span><div><div class="t">Chats</div><div class="s">tidigare samtal</div></div></div>
            <div class="row tile" data-focus data-go="projects"><span class="ico">📁</span><div><div class="t">Projects</div><div class="s">välj repo</div></div></div>
            <div class="row tile" data-focus data-go="code"><span class="ico">📄</span><div><div class="t">Code</div><div class="s">bläddra i filer</div></div></div>
          </div>`;
        view.querySelectorAll("[data-go]").forEach((el) =>
          el.addEventListener("click", () => openMode(el.dataset.go)));
        registerFocus();
      }

      function openMode(scope) {
        backStack.push(showHome);
        showList(scope, "…");
        ws.send(JSON.stringify({ type: "list", scope }));
      }

      function showList(scope, statusText, items) {
        nav.mode = "select";
        const titles = { chats: "Chats", projects: "Projects", code: "Code" };
        const extra = scope === "chats"
          ? `<div class="row" data-focus id="newChat"><div class="t">＋ Ny chatt</div><div class="s">starta nytt samtal</div></div>` : "";
        const body = items
          ? (items.length || scope === "chats"
              ? extra + items.map((it, i) =>
                  `<div class="row" data-focus data-id="${encodeURIComponent(it.id)}"><div class="t">${esc(it.title)}</div><div class="s">${esc(it.subtitle || "")}</div></div>`).join("")
              : `<div class="empty">Inget här än</div>`)
          : `<div class="empty">${esc(statusText || "…")}</div>`;
        view.innerHTML = `<div class="hdr"><button class="back" data-back>‹</button>${titles[scope] || scope}</div><div class="list" id="list">${body}</div>`;
        view.querySelector("[data-back]").onclick = () => back();
        const nc = document.getElementById("newChat");
        if (nc) nc.onclick = () => { ws.send(JSON.stringify({ type: "new_chat" })); };
        view.querySelectorAll("[data-id]").forEach((el) =>
          el.addEventListener("click", () => onPick(scope, decodeURIComponent(el.dataset.id))));
        registerFocus();
      }

      function onPick(scope, id) {
        if (scope === "projects") ws.send(JSON.stringify({ type: "select_project", id }));
        else if (scope === "chats") ws.send(JSON.stringify({ type: "open_chat", id }));
        else if (scope === "code") ws.send(JSON.stringify({ type: "open_file", id }));
      }

      function showFile(path, content) {
        nav.mode = "scroll";
        view.innerHTML = `<div class="hdr"><button class="back" data-back>‹</button>${esc(path.split("/").pop())}</div><pre class="code" id="code"></pre>`;
        document.getElementById("code").textContent = content;
        nav.scrollEl = document.getElementById("code");
        view.querySelector("[data-back]").onclick = () => back();
        backStack.push(() => openMode("code"));
      }

      function showChat() {
        nav.mode = "scroll"; setProjTag();
        const micUi = meta.stt ? `<button class="mic" id="mic" title="Håll för att tala">🎤</button>`
          : `<span class="hint">Röst ej konfigurerad</span>`;
        view.innerHTML = `
          <div class="hdr"><button class="back" data-back>‹</button>Chat · ${esc(project)}</div>
          <div class="feed" id="feed"></div>
          <div class="dock"><button class="kbd" id="kbd" title="Skriv">⌨</button>${micUi}</div>
          <div class="hint" id="hint">${meta.stt ? "Håll mic och tala · snurra kronan för att scrolla" : "Skriv nedan"}</div>
          <div class="typing" id="typing" style="display:none"><input id="text" placeholder="Skriv…" /><button id="sendBtn">➤</button></div>`;
        nav.scrollEl = document.getElementById("feed");
        view.querySelector("[data-back]").onclick = () => showHome();
        backStack = [showHome];
        wireChat();
      }

      function bubble(cls, text, opts = {}) {
        const feed = document.getElementById("feed"); if (!feed) return;
        const el = document.createElement("div"); el.className = "bubble " + cls; el.textContent = text;
        if (opts.report) {
          const f = document.createElement("span"); f.className = "flag"; f.textContent = "⚑"; f.title = "Rapportera";
          f.onclick = () => { ws.send(JSON.stringify({ type: "report", text, reason: "user_report" })); f.textContent = "✓"; };
          el.appendChild(f);
        }
        feed.appendChild(el); feed.scrollTop = feed.scrollHeight;
      }

      function wireChat() {
        const typing = document.getElementById("typing");
        document.getElementById("kbd").onclick = () => {
          typing.style.display = typing.style.display === "none" ? "flex" : "none";
          if (typing.style.display === "flex") document.getElementById("text").focus();
        };
        const sendText = () => {
          const t = document.getElementById("text").value.trim(); if (!t) return;
          bubble("me", t); ws.send(JSON.stringify({ type: "prompt", text: t }));
          document.getElementById("text").value = "";
        };
        document.getElementById("sendBtn").onclick = sendText;
        document.getElementById("text").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.stopPropagation(); sendText(); } });

        const mic = document.getElementById("mic");
        if (mic) {
          const start = async (e) => {
            e.preventDefault();
            try {
              const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
              recMime = MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm" : "";
              recorder = new MediaRecorder(stream, recMime ? { mimeType: recMime } : undefined);
              chunks = []; recorder.ondataavailable = (ev) => ev.data.size && chunks.push(ev.data);
              recorder.onstop = sendAudio; recorder.start(); mic.classList.add("rec");
              document.getElementById("hint").textContent = "Lyssnar… släpp för att skicka";
            } catch { document.getElementById("hint").textContent = "Mikrofon nekad"; }
          };
          const stop = (e) => { e && e.preventDefault(); mic.classList.remove("rec"); if (recorder && recorder.state !== "inactive") recorder.stop(); };
          mic.addEventListener("pointerdown", start);
          mic.addEventListener("pointerup", stop);
          mic.addEventListener("pointerleave", stop);
        }
      }

      async function sendAudio() {
        const blob = new Blob(chunks, { type: recMime || "audio/webm" });
        const buf = new Uint8Array(await blob.arrayBuffer());
        let bin = ""; for (const b of buf) bin += String.fromCharCode(b);
        document.getElementById("hint").textContent = "Transkriberar…";
        ws.send(JSON.stringify({ type: "audio_start", mime: recMime || "audio/webm" }));
        ws.send(JSON.stringify({ type: "audio_chunk", data: btoa(bin) }));
        ws.send(JSON.stringify({ type: "audio_end" }));
      }

      const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

      // ---- Flow ----
      async function boot() {
        meta = await (await fetch("/meta")).json();
        document.getElementById("demoTag").textContent = meta.demoMode ? "· DEMO" : "";
        showPairing();
        const dc = await (await fetch("/device/code", { method: "POST" })).json();
        deviceCode = dc.device_code;
        document.getElementById("qr").innerHTML = '<img src="' + dc.qr_data_url + '">';
        document.getElementById("uc").textContent = dc.user_code;
        startPolling(dc.interval);
      }
      function startPolling(intervalS) {
        clearInterval(pollTimer);
        pollTimer = setInterval(async () => {
          const r = await fetch("/device/token", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ device_code: deviceCode }) });
          const data = await r.json();
          if (data.status === "approved") { clearInterval(pollTimer); token = data.access_token; connect(); }
          else if (data.status === "expired_token") { clearInterval(pollTimer); showPairing(); }
        }, (intervalS || 3) * 1000);
      }
      function connect() {
        const proto = location.protocol === "https:" ? "wss" : "ws";
        ws = new WebSocket(proto + "://" + location.host + "/ws");
        ws.onopen = () => { dot.classList.add("on"); ws.send(JSON.stringify({ type: "auth", token })); };
        ws.onclose = () => dot.classList.remove("on");
        ws.onmessage = (ev) => handle(JSON.parse(ev.data));
      }

      function handle(m) {
        switch (m.type) {
          case "authed": project = m.project || "workspace"; if (m.consented) showHome(); else showConsent(); break;
          case "consented": showHome(); break;
          case "needs_consent": showConsent(); break;
          case "list_result": showList(m.scope, null, m.items); break;
          case "project_selected": project = m.title; showHome(); break;
          case "chat_opened": showChat(); break;
          case "file": showFile(m.path, m.content); break;
          case "transcribing": { const h = document.getElementById("hint"); if (h) h.textContent = "Transkriberar…"; break; }
          case "transcript": bubble("me", m.text || "(tomt)"); { const h = document.getElementById("hint"); if (h) h.textContent = ""; } break;
          case "assistant": pendingAI += (m.text || "") + " "; bubble("ai" + (m.filtered ? " filtered" : ""), m.text, { report: !m.filtered }); break;
          case "tool_use": bubble("tool", "⚙ " + m.name); break;
          case "needs_confirmation": bubble("ai filtered", "⚠ Kräver bekräftelse: " + m.command); break;
          case "turn_done": speak(pendingAI.trim()); pendingAI = ""; break;
          case "stt_unavailable": bubble("ai filtered", "Röst är inte konfigurerad på servern."); break;
          case "error": bubble("ai filtered", "Fel: " + m.message); break;
        }
      }

      boot();
    </script>
  </body>
</html>
