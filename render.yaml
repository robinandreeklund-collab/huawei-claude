# Render Blueprint — one-click deploy of the relay backend.
# Docs: https://render.com/docs/blueprint-spec
#
# Uses the Docker runtime (backend/Dockerfile) so git and Node 22 are present for
# Claude Code's tools. Render injects PORT automatically; the server reads it.
services:
  - type: web
    name: huawei-claude-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    branch: claude/huawei-watch-app-f0gwye
    healthCheckPath: /healthz
    envVars:
      # Sandbox mode: seeded example content, budget + rate caps. Safe for testing.
      - key: DEMO_MODE
        value: "true"
      #
      # NO Claude credential is needed here to deploy. After the service is live,
      # open  https://<your-app>.onrender.com/connect  on your phone and paste the
      # token from `claude setup-token` once — it's stored by the backend and uses
      # YOUR Claude Pro/Max subscription (no per-token API billing).
      #
      #   npm i -g @anthropic-ai/claude-code   (if not installed)
      #   claude setup-token                   (log in with your Claude account)
      #   → copy the sk-ant-oat01-... token, paste it on the /connect page.
      #
      # Optional — protect the /connect page with a shared secret so only you can
      # set the credential (Render prompts for it; never committed):
      - key: ADMIN_SECRET
        sync: false
      # Optional — persist the connected token across restarts/redeploys by pointing
      # CRED_FILE at a Render persistent disk mount (otherwise re-paste after a deploy):
      # - key: CRED_FILE
      #   value: /data/claude-cred.json
      #
      # Alternatives to the /connect page (either also works, set in the dashboard):
      #   CLAUDE_CODE_OAUTH_TOKEN  — subscription token, same as /connect but via env
      #   ANTHROPIC_API_KEY        — pay-per-token API billing instead of subscription
      #
      # Optional voice (Swedish STT): set STT_API_URL + STT_API_KEY in the dashboard
      # (any OpenAI-compatible /audio/transcriptions endpoint).
