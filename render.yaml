# Render Blueprint — one-click deploy of the relay backend.
# Docs: https://render.com/docs/blueprint-spec
#
# Uses the Docker runtime (backend/Dockerfile) so git and Node 22 are present for
# Claude Code's tools. Render injects PORT automatically; the server reads it.
services:
  - type: web
    name: huawei-claude-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    branch: claude/huawei-watch-app-f0gwye
    healthCheckPath: /healthz
    envVars:
      # Sandbox mode: seeded example content, budget + rate caps. Safe for testing.
      - key: DEMO_MODE
        value: "true"
      # Use YOUR Claude Pro/Max subscription — no per-token API billing.
      # Generate once on your own machine:
      #   npm i -g @anthropic-ai/claude-code   (if not installed)
      #   claude setup-token                   (log in with your Claude account)
      # Copy the sk-ant-oat01-... token; Render prompts for it here (never committed).
      # Treat it like a password; it's valid ~1 year. Do NOT also set ANTHROPIC_API_KEY.
      - key: CLAUDE_CODE_OAUTH_TOKEN
        sync: false
      # Alternative (pay-per-token API billing instead of subscription): remove the
      # line above and set ANTHROPIC_API_KEY in the Render dashboard instead.
      #
      # Optional voice (Swedish STT): set STT_API_URL + STT_API_KEY in the dashboard
      # (any OpenAI-compatible /audio/transcriptions endpoint).
